name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

defaults:
  run:
    working-directory: izelia-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Download three.js for offline 3D
        run: npm run vendor
      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build debug APK
        working-directory: izelia-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IZELIA-debug-apk
          path: izelia-app/android/app/build/outputs/apk/debug/app-debug.apk
