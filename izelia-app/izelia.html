<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F3EC"><meta name="description" content="IZELIA: contemporary African fashion, accessories and Gara fabrics from Sierra Leone, with an AI Tailoring Studio."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>IZELIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: IZELIA fashion house — editorial storefront with a sticky header, and the AI Tailoring Studio as a first-class section with its own sub-navigation and a 3D stage. */
:root{
  --ground:#F6F3EC; --surface:#FFFFFF; --surface-2:#F1EDE4; --surface-3:#E6E0D3;
  --line:#E2DCCF; --line-2:#CFC7B7;
  --ink:#171614; --ink-2:#55504A; --ink-3:#8A8378;
  --accent:#9CC42B; --accent-ink:#141A04; --accent-text:#4F6A10; --accent-soft:#EEF4DA; --accent-line:#C9DD8E;
  --gara:#2F4C8F; --earth:#8A5A3B;
  --tape:#D9A520; --tape-soft:#F6E7BC;
  --ok:#2C7A57; --ok-soft:#DCEEE4; --warn:#A86B12; --warn-soft:#F5E6CC; --bad:#B1402D; --bad-soft:#F4DDD7; --info:#2D65A8;
  --stage-top:#F1EDE4; --stage-bottom:#DDD6C8;
  --shadow:0 1px 2px rgba(23,22,20,.05),0 10px 30px rgba(23,22,20,.08);
  --f-display:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  --f-quote:"Cormorant Garamond",Garamond,Georgia,serif;
  --chrome:#1B1A17; --chrome-2:#24221E; --chrome-ink:#F2EEE6; --chrome-dim:#B9B2A4; --earth-dark:#2A1E16;
  --f-body:"Jost","Futura","Century Gothic",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-s:4px; --r-m:8px; --r-l:12px;
  --tabbar:64px; --maxw:1320px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121211; --surface:#1A1A18; --surface-2:#22211E; --surface-3:#2C2B27;
  --line:#33312C; --line-2:#45423B;
  --ink:#F2EEE6; --ink-2:#BDB6AA; --ink-3:#8F887C;
  --accent-ink:#141A04; --accent-text:#B7DB52; --accent-soft:#2A3313; --accent-line:#55691F;
  --gara:#8DA6E0; --earth:#C99A77;
  --tape:#E4B83F; --tape-soft:#3A3120;
  --ok:#6CC59A; --ok-soft:#1D3328; --warn:#E3A84E; --warn-soft:#382B17; --bad:#EE8A76; --bad-soft:#3D2420; --info:#8DB6EC;
  --stage-top:#22211E; --stage-bottom:#141412;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#121211; --surface:#1A1A18; --surface-2:#22211E; --surface-3:#2C2B27;
  --line:#33312C; --line-2:#45423B;
  --ink:#F2EEE6; --ink-2:#BDB6AA; --ink-3:#8F887C;
  --accent-ink:#141A04; --accent-text:#B7DB52; --accent-soft:#2A3313; --accent-line:#55691F;
  --gara:#8DA6E0; --earth:#C99A77;
  --tape:#E4B83F; --tape-soft:#3A3120;
  --ok:#6CC59A; --ok-soft:#1D3328; --warn:#E3A84E; --warn-soft:#382B17; --bad:#EE8A76; --bad-soft:#3D2420; --info:#8DB6EC;
  --stage-top:#22211E; --stage-bottom:#141412;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;line-height:1.08}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
p{margin:0}

/* ---------- shell ---------- */
.ann{background:var(--ink);color:var(--surface);text-align:center;font-size:12.5px;letter-spacing:.06em;padding:7px 16px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 24px}
.logo{display:flex;align-items:center;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);flex:none}
.logo img{height:38px;width:auto;display:block}
.logo .wm{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.16em;line-height:1}
.mainnav{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;flex:1;justify-content:center}
.mainnav button{border:0;background:none;padding:8px 9px;font-size:13.5px;letter-spacing:.04em;color:var(--ink-2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.mainnav button:hover{color:var(--ink)}
.mainnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.mainnav .studio-link{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 14px;font-weight:600;margin-left:6px;border:0}
.mainnav .studio-link[aria-current="page"]{box-shadow:0 0 0 2px var(--ink)}
.icons{display:flex;gap:2px;align-items:center;flex:none}
.icobtn{position:relative;width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icobtn:hover{background:var(--surface-2)}
.icobtn svg{width:21px;height:21px}
.icobtn .count{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-body)}
.menubtn{display:none}
.subnav{border-top:1px solid var(--line);background:var(--surface)}
.subnav-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:4px;padding:0 24px;overflow-x:auto;scrollbar-width:none;align-items:center}
.subnav-in .tag-studio{font-family:var(--f-display);font-size:18px;font-weight:600;padding-right:12px;margin-right:4px;border-right:1px solid var(--line);white-space:nowrap}
.subnav button{border:0;background:none;padding:11px 10px;font-size:13.5px;color:var(--ink-3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;position:relative}
.subnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.subnav .count{margin-left:4px;font-family:var(--f-mono);font-size:10.5px;background:var(--tape);color:#1D1C1A;border-radius:99px;padding:0 5px}
main{min-width:0;max-width:var(--maxw);margin:0 auto;padding:28px 24px 56px}
main.full{max-width:none;padding:0 0 56px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head h1{font-family:var(--f-display);font-size:clamp(34px,4vw,52px);font-weight:600;letter-spacing:-.01em;line-height:1}
.page-head p{max-width:62ch;color:var(--ink-2);margin-top:8px}
.who .dot,.pitem .dot{color:var(--accent-text)}
.tabbar{display:none}
.drawer{position:fixed;inset:0;z-index:90;display:flex}
.drawer .panel-d{width:min(360px,88vw);background:var(--surface);height:100%;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;animation:slidein .2s}
.drawer .shade{flex:1;background:rgba(15,14,12,.45)}
@keyframes slidein{from{transform:translateX(-30px);opacity:.6}}
.drawer .dlink{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:12px 4px;font-size:17px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.drawer .dlink.studio{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:12px;font-weight:600;border:0;margin:8px 0}
.drawer h4{margin:14px 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width: 1180px){ .mainnav button{padding:8px 6px;font-size:12.5px} .hdr-in{gap:12px} }
@media (max-width: 1020px){
  .mainnav{display:none}
  .menubtn{display:grid}
  .hdr-in{padding:10px 16px;justify-content:space-between}
  .logo .wm{font-size:24px} .logo img{height:30px}
  .icons .hide-m{display:none}
  .subnav-in{padding:0 16px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:500;padding:4px 0;cursor:pointer;position:relative;font-family:var(--f-body)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button.studio{color:var(--accent-text)}
  .tabbar .count{position:absolute;top:0;right:calc(50% - 20px);background:var(--accent);color:var(--accent-ink);font-size:10px;border-radius:99px;padding:0 5px}
  main{padding:18px 16px calc(var(--tabbar) + 40px)}
  main.full{padding:0 0 calc(var(--tabbar) + 40px)}
  .page-head{margin-bottom:16px}
}
/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s{gap:8px}
.grid{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;min-width:0}
.panel.flat{background:transparent}
.panel h2{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:-.01em}
.panel h3{font-size:15px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.chip.tape{background:var(--tape-soft);color:var(--ink);border-color:transparent}
.chip.demo{background:transparent;border-style:dashed;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.field small{font-weight:400;color:var(--ink-3)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);font-size:15px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;flex:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.note{padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.45}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.empty{padding:28px 20px;border:1px dashed var(--line-2);border-radius:var(--r-l);text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500;min-width:0}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.data td.num,table.data th.num{text-align:right}
.scroll-x{overflow-x:auto;max-width:100%}
.bar{height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0}

/* tape measure rule — used as section divider on measurement views */
.tape{height:14px;background-image:repeating-linear-gradient(90deg,var(--ink-3) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--ink-2) 0 1px,transparent 1px 50px);background-size:100% 7px,100% 14px;background-repeat:no-repeat;opacity:.55}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.gcard .flat{aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;position:relative;max-width:100%}
.gcard .flat svg{width:82%;height:82%}
.gcard .flat img{width:100%;height:100%;object-fit:cover}
.gcard .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.gcard .meta b{font-size:14px;font-weight:600;line-height:1.25}
.gcard .meta span{font-size:12px;color:var(--ink-3)}
.gcard .badge{position:absolute;top:8px;left:8px}
.gcard .fav{position:absolute;top:6px;right:6px;border:0;background:var(--surface);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}
.gcard .fav[aria-pressed="true"]{color:var(--bad)}
.gcard .fav svg{width:16px;height:16px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,180px);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

/* ---------- stage (3D) ---------- */
.stage{position:relative;border-radius:var(--r-l);overflow:hidden;background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));border:1px solid var(--line);min-height:300px;touch-action:none;user-select:none}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage .hud{position:absolute;left:12px;top:12px;right:58px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;align-items:flex-start}
.stage .hud>*{pointer-events:auto}
.stage .hud .chip{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px)}
.stage .views{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.stage .views button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.stage .views button:hover{background:var(--surface-2);color:var(--ink)}
.stage .views button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage .tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.stage .tools button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.stage .tools button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stage .tools svg{width:17px;height:17px}
.stage .tags{position:absolute;inset:0;pointer-events:none}
.stage .tag{position:absolute;transform:translate(10px,-50%);font-family:var(--f-mono);font-size:11px;background:var(--tape);color:#1D1C1A;padding:1px 6px;border-radius:3px;white-space:nowrap}
.stage .split-label{position:absolute;bottom:58px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 8px;border-radius:4px}
.stage .split-line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line-2)}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.stage.full{position:fixed;inset:0;z-index:60;border-radius:0;border:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.studio .stage{height:calc(100vh - 190px);min-height:460px;position:sticky;top:132px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.steps span.done{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps span.cur{border-color:var(--ink);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl>.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.level{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.level div{padding:8px 6px;border-radius:var(--r-s);background:var(--surface-2);font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;line-height:1.2}
.level div.on{background:var(--ok-soft);color:var(--ok)}
.level div.cur{background:var(--ink);color:var(--surface)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:10px 8px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.cat svg{width:46px;height:46px}
.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);color:var(--ink)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ref{position:relative;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;background:var(--surface-2);max-width:100%}
.ref img{width:100%;height:100%;object-fit:cover}
.ref select{position:absolute;left:4px;right:4px;bottom:4px;min-height:26px;padding:2px 4px;font-size:11px;width:calc(100% - 8px)}
.ref button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:13px;line-height:1}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:14px;text-align:center;font-size:13px;color:var(--ink-2);cursor:pointer;display:block}
.drop:hover{border-color:var(--accent)}
.spec-list{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.spec-list dt{color:var(--ink-3)} .spec-list dd{margin:0;font-weight:600}
.diff{display:flex;flex-direction:column;gap:6px}
.diff label{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:var(--r-s);background:var(--surface-2)}
.ai-out{white-space:pre-wrap;font-size:13px;color:var(--ink-2);max-height:180px;overflow:auto}

/* ---------- body ---------- */
.body-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.body-layout .stage{height:560px;position:sticky;top:132px}
.mgroup{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.minput{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);min-width:0}
.minput:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.minput span{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.minput span em{font-style:normal;color:var(--warn);font-weight:600}
.minput .inwrap{display:flex;align-items:baseline;gap:4px}
.minput input{border:0;padding:0;min-height:28px;font-family:var(--f-mono);font-size:18px;background:transparent;box-shadow:none!important}
.minput .u{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.minput.missing{border-style:dashed}
.guide{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.guide svg{width:120px;height:220px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pitem[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.pitem .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.pitem b{display:block;font-size:14px}
.pitem small{color:var(--ink-3);font-size:12px}

/* ---------- workshop ---------- */
.pattern-svg{width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.layout-wrap{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2)}
.qty-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qty{padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.qty b{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.qty span{font-size:12px;color:var(--ink-3)}
.steplist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0}
.steplist li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.steplist li .n{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--ink-3)}
.steplist li h4{margin:0 0 4px;font-size:15px}
.steplist li p{font-size:14px;color:var(--ink-2)}
.steplist li .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sheet-doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:28px;display:flex;flex-direction:column;gap:20px}
.sheet-doc .flats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sheet-doc .flats div{background:var(--surface-2);border-radius:var(--r-m);padding:12px;text-align:center;font-size:12px;color:var(--ink-3)}
.sheet-doc .flats svg{width:100%;max-width:260px;height:auto}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero .stage{height:420px}
.welcome{display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.welcome h1{font-family:var(--f-display);font-size:clamp(34px,4.4vw,56px);font-weight:500;letter-spacing:-.02em;line-height:1.02}
.welcome h1 em{font-style:italic;color:var(--accent-text)}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.cta.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cta b{font-family:var(--f-display);font-size:22px;font-weight:500}
.cta span{font-size:13px;opacity:.75}
.section{margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.section-head h2{font-family:var(--f-display);font-size:24px;font-weight:500}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .grow small{color:var(--ink-3);font-size:12.5px}
.li .thumb{width:46px;height:46px;border-radius:var(--r-s);background:var(--surface-2);display:grid;place-items:center;flex:none}
.li .thumb svg{width:38px;height:38px}
.unread{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{flex:1 1 60px;height:5px;border-radius:9px;background:var(--surface-3)}
.timeline span.on{background:var(--ok)}
.timeline span.now{background:var(--accent)}
.comments{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.cmt{padding:8px 12px;border-radius:var(--r-m);background:var(--surface-2);font-size:13.5px}
.cmt.mine{background:var(--accent-soft)}
.cmt small{display:block;color:var(--ink-3);font-size:11.5px;margin-bottom:2px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1}
.stat span{font-size:12.5px;color:var(--ink-3)}
.pipeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pipeline li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:var(--r-s);background:var(--surface-2)}
.pipeline li i{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-3);margin-top:1px}
.pipeline li.ok i{background:var(--ok);color:#fff}
.pipeline li.warn i{background:var(--warn);color:#fff}
.pipeline li.bad i{background:var(--bad);color:#fff}
.pipeline li.run i{background:var(--accent);color:var(--accent-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ---------- overlay ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,14,12,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r-l);width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal h2{font-family:var(--f-display);font-size:26px;font-weight:500}
@media (max-width:860px){
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:var(--r-l) var(--r-l) 0 0;max-height:88vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s}
  @keyframes up{from{transform:translateY(30px)}}
}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;animation:up .2s}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:860px){.toasts{bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px))}}

/* ---------- responsive splits ---------- */
@media (max-width:1100px){
  .studio{grid-template-columns:minmax(0,1fr) 340px}
  .body-layout{grid-template-columns:minmax(0,1fr)}
  .body-layout .stage{position:relative;top:0;height:440px}
}
@media (max-width:860px){
  .studio{grid-template-columns:minmax(0,1fr)}
  .studio .stage{height:58vh;min-height:340px;position:relative;top:0}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .stage{height:340px}
  .cta2{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
  .panel{padding:16px}
  .guide{grid-template-columns:90px 1fr}
  .guide svg{width:90px;height:170px}
  .sheet-doc{padding:16px}
  .sheet-doc .flats{grid-template-columns:1fr 1fr}
}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.two,.three{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-3);gap:12px;text-align:center}
.spinner{width:28px;height:28px;border:2px solid var(--line-2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= STOREFRONT ================= */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media (max-width:1020px){.wrap{padding:0 16px}}
.btn.lime{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);letter-spacing:.06em;text-transform:uppercase;font-size:13px;border-radius:2px;padding:12px 22px;min-height:46px}
.btn.lime:hover{filter:brightness(.95)}
.btn.line{border-radius:2px;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;padding:10px 18px}
.kicker{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dsp{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em;line-height:.98}
.hero-s{position:relative;min-height:min(78vh,720px);display:grid;align-items:end;overflow:hidden;background:var(--ink);color:#fff}
.hero-s .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.hero-s .bg canvas{width:100%;height:100%;display:block}
.hero-s .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%)}
.hero-s .txt{position:relative;max-width:var(--maxw);width:100%;margin:0 auto;padding:48px 24px 56px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.hero-s h1{font-family:var(--f-display);font-size:clamp(46px,8vw,112px);font-weight:600;line-height:.9;max-width:12ch;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.hero-s p{max-width:46ch;font-size:17px;opacity:.9}
.hero-s .note-img{position:absolute;right:16px;top:16px;font-size:11.5px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px;color:#fff}
.sec{padding:64px 0 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-size:clamp(30px,3.6vw,46px);font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.linkbtn{border:0;background:none;padding:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--ink);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:220px;gap:12px}
.tile{position:relative;overflow:hidden;border:0;padding:0;cursor:pointer;text-align:left;background:var(--surface-2);color:#fff;min-width:0}
.tile .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s ease}
.tile .bg canvas{width:100%;height:100%;display:block}
.tile:hover .bg{transform:scale(1.04)}
.tile .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.tile .lbl{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.tile .lbl b{font-family:var(--f-display);font-size:clamp(24px,2.6vw,36px);font-weight:600;line-height:1;text-transform:uppercase}
.tile .lbl span{font-size:12.5px;opacity:.85;white-space:nowrap}
.tile.t1{grid-column:span 3;grid-row:span 2}.tile.t2{grid-column:span 3}.tile.t3{grid-column:span 2}.tile.t4{grid-column:span 1}.tile.t5{grid-column:span 6}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}.tile.t1{grid-column:span 2;grid-row:span 2}.tile.t2,.tile.t3,.tile.t4{grid-column:span 1}.tile.t5{grid-column:span 2}}
.pgrid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:28px 18px}
@media (max-width:1020px){.pgrid{grid-template-columns:repeat(min(var(--cols,4),3),minmax(0,1fr))}}
@media (max-width:640px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}}
.pcard{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.pcard .img{position:relative;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden;cursor:pointer;border:0;padding:0;width:100%;max-width:100%;display:block}
.pcard .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;display:block}
.pcard:hover .img img{transform:scale(1.04)}
.pcard .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);text-align:center;padding:12px;font-size:12px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 14px,var(--surface-3) 14px 15px)}
.pcard .ph b{font-family:var(--f-display);font-size:30px;color:var(--ink-2);font-weight:600;letter-spacing:.1em}
.pcard .acts{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.pcard .acts button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.pcard .acts button[aria-pressed="true"]{color:var(--bad)}
.pcard .acts svg{width:17px;height:17px}
.pcard .qv{position:absolute;left:8px;right:8px;bottom:8px;opacity:0;transform:translateY(6px);transition:.2s}
.pcard:hover .qv,.pcard:focus-within .qv{opacity:1;transform:none}
@media (hover:none){.pcard .qv{display:none}}
.pcard .qv button{width:100%;background:var(--surface);border:0;padding:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.pcard .nm{font-size:14.5px;line-height:1.3;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.pcard .pr{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pcard .badge{position:absolute;left:8px;top:8px;background:var(--surface);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters .field{min-width:130px;flex:1 1 140px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;align-items:center}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.subchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}
.subchips button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.subchips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.coll-head{padding:56px 0 30px;border-bottom:1px solid var(--line);margin-bottom:24px}
.coll-head h1{font-family:var(--f-display);font-size:clamp(36px,7vw,96px);overflow-wrap:break-word;hyphens:auto;font-weight:600;text-transform:uppercase;line-height:.92}
.coll-head p{max-width:56ch;color:var(--ink-2);margin-top:10px;font-size:16px}
.royal{background:#14130F;color:#F2EEE6;border:0;padding:64px 24px 40px;margin:0 -24px 24px}
.royal .kicker{color:#B9B09F}.royal p{color:#C9C1B2}

.pd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.pd{grid-template-columns:minmax(0,1fr);gap:22px}}
.gallery{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
.gallery .thumbs{display:flex;flex-direction:column;gap:8px}
.gallery .thumbs button{border:1px solid var(--line);padding:0;background:var(--surface-2);aspect-ratio:4/5;cursor:pointer;overflow:hidden}
.gallery .thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.gallery .thumbs img{width:100%;height:100%;object-fit:cover}
.gallery .main{position:relative;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden;cursor:zoom-in;max-width:100%}
.gallery .main img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.gallery .main.zoom img{transform:scale(2);cursor:zoom-out}
@media (max-width:640px){.gallery{grid-template-columns:minmax(0,1fr)}.gallery .thumbs{flex-direction:row;order:2;overflow-x:auto}.gallery .thumbs button{width:64px;flex:none}}

    if (c==='resource_exhausted') return 'Too many saves at once. Wait a moment and try again.';
    if (c==='revoked') return 'Access to saved data was withdrawn for this page.';
    return 'Could not save right now. Check your connection and try again.';
  },

  /* ---------- private collections ---------- */
  async put(coll, obj){
    obj.updatedAt = obj.updatedAt || nowIso();
    this.private[coll][obj.id] = obj;
    if (this.mode==='local') return this.saveLocal();
    const ref = this.home().collection(coll).doc(obj.id);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.set(clone(obj)))); return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },
  async del(coll, id){
    delete this.private[coll][id];
    if (this.mode==='local') return this.saveLocal();
    const ref = this.home().collection(coll).doc(id);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.delete())); return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },
  async putSettings(){
    if (this.mode==='local') return this.saveLocal();
    const ref = this.db.doc(`data/users/${this.uid}/settings`);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.set(clone(this.settings)))); return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },

  /* ---------- shared garment library ---------- */
  canPublish(){
    if (this.mode==='local') return S.demoRole!=='customer';
    return this.role.owner || this.role.editor;
  },
  async putGarment(g){
    g.updatedAt = nowIso();
    if (this.mode==='local'){ this.garments[g.id]=g; return this.saveLocal(); }
    const ref = this.db.collection('garments').doc(g.id);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.set(clone(g)))); this.garments[g.id]=g; return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },
  async delGarment(id){
    if (this.mode==='local'){ delete this.garments[id]; return this.saveLocal(); }
    const ref = this.db.collection('garments').doc(id);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.delete())); delete this.garments[id]; return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },

  /* ---------- shared projects (customer ↔ tailor) ----------
     Each customer owns shares/<their id>; only they and Editors (tailors) can read it. */
  async putShare(item){
    item.updatedAt = nowIso();
    this.myShares.items[item.id] = item;
    if (this.mode==='local') return this.saveLocal();
    const ref = this.db.doc(`shares/${this.uid}`);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.set(clone({owner:this.uid, items:this.myShares.items})))); return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },
  async delShare(id){
    delete this.myShares.items[id];
    if (this.mode==='local') return this.saveLocal();
    const ref = this.db.doc(`shares/${this.uid}`);
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.set(clone({owner:this.uid, items:this.myShares.items})))); return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },
  async tailorUpdate(ownerId, itemId, patch){
    if (this.mode==='local'){
      const it = this.myShares.items[itemId]; if (!it) return false;
      Object.assign(it, patch, {updatedAt:nowIso()}); return this.saveLocal();
    }
    const ref = this.db.doc(`shares/${ownerId}`);
    const cur = this.allShares[ownerId]; if (!cur || !cur.items || !cur.items[itemId]) return false;
    const merged = Object.assign({}, cur.items[itemId], patch, {updatedAt:nowIso()});
    cur.items[itemId] = merged;
    try { await this.serial(ref.path, ()=>this.withRetry(()=>ref.update({items:{[itemId]:clone(merged)}}))); return true; }
    catch(e){ toast(this.explain(e), true); return false; }
  },
  async names(ids){
    if (!this.user || !ids.length) return {};
    try { return await this.user.profiles(ids); } catch{ return {}; }
  },
};

/* ---------- toasts ---------- */

  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = 'toast'+(bad?' bad':''); t.setAttribute('role','status'); t.textContent = msg;
  box.appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, bad?5200:2600);
}

const Caps = {
  sample:null, downloads:null, sampleImages:false,
  async init(){
    if (!(window.claude && typeof window.claude.use==='function')) return;
    try { this.sample = await window.claude.use('sample'); } catch{ this.sample=null; }
    if (this.sample){ try { const l = await this.sample.limits(); this.sampleImages = !!(l && l.images); } catch{ this.sampleImages=false; } }
    try { this.downloads = await window.claude.use('downloads'); } catch{ this.downloads=null; }
    App.render();
  },
};
async function offerDownload(filename, data){
  if (!Caps.downloads){
    if (!window.claude){ // standalone website or app: plain browser download
      try {
        const ext = filename.split('.').pop();
        const type = {csv:'text/csv', json:'application/json', svg:'image/svg+xml', html:'text/html'}[ext] || 'application/octet-stream';
        const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type}));
        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Downloaded '+filename); return true;
      } catch(e){ toast('This device could not save the file.', true); return false; }
    }
    toast('Saving files is not available in this view.', true); return false;
  }
  try { const r = await Caps.downloads.save({filename, data}); if (r.status==='saved') toast('Saved '+filename); return true; }
  catch(e){
    if (e.code==='declined') return false;
    if (e.code==='rate_limited'){ toast('A save prompt is already open.'); return false; }
    toast('Could not save the file ('+(e.code||'error')+').', true); return false;
  }
}

function garmentSubtype(n){
  const s = n.toLowerCase();
  if (s.includes('kimono')) return 'Kimono jackets';
  if (s.includes('cape')) return 'Capes & wraps';
  if (s.includes('bubu')) return 'Bubu';
  if (s.includes('kaftan') || s.includes('two piece')) return 'Two-piece sets';
  if (s.includes('gown')) return 'Gowns';
  if (s.includes('dress') || s.includes('maxi')) return 'Dresses';
  if (s.includes('blouse') || s.includes('top')) return 'Tops & blouses';
  return 'Other';
}

/* ================= BODY MODEL + FITTING SERVICE =================
   A parametric body built from the saved measurements. The same model drives
   the 3D avatar, the garment shells, the fit checks and the pattern drafts,
   so every part of the app reads one body. */

function estimateFromHeight(H, shape, weight){
  const f = shape==='f';
  const exp = 22*Math.pow(H/100,2);
  const k = weight ? clamp(Math.sqrt(weight/exp), .82, 1.4) : 1;
  const c = v => r1(v*k), l = v => r1(v);
  const chest = c(H*(f?.55:.56));
  return {height:H, chest, waist:c(H*(f?.43:.47)), hip:c(H*(f?.6:.565)), neck:c(H*(f?.2:.222)), shoulder:l(H*(f?.233:.255)),
    upperArm:c(H*(f?.165:.175)), wrist:c(H*(f?.09:.096)), armLength:l(H*(f?.35:.356)), torsoLength:l(H*(f?.245:.256)),
    thigh:c(H*(f?.345:.325)), knee:c(H*.218), calf:c(H*.207), ankle:c(H*.128), inseam:l(H*.455), outseam:l(H*.598),
    underbust: f? c(H*.455) : null, frontRise:l(H*.155), backRise:l(H*.215)};
}

function filledMeasurements(prof){
  const m = Object.assign({}, prof.m||{});
  const H = m.height || (prof.shape==='f'?165:177);
  const est = estimateFromHeight(H, prof.shape, m.weight);
  const estimated = [];
  for (const k of Object.keys(est)){ if (m[k]==null || m[k]==='' || isNaN(m[k])){ if (est[k]!=null){ m[k]=est[k]; estimated.push(k);} } }
  if (!m.underbust) m.underbust = m.chest*(prof.shape==='f'?.83:.9);
  return {m, estimated};
}

const K_TORSO = 0.70;
const CF = 2*Math.PI*Math.sqrt((1+K_TORSO*K_TORSO)/2);

function bodyGeom(prof){
  const {m, estimated} = filledMeasurements(prof);
  const H = m.height;
  const L = {H};
  L.ankleY = .045*H; L.kneeY = .285*H;
  L.crotchY = clamp(m.inseam, .38*H, .52*H);
  L.waistY = clamp(m.outseam, L.crotchY+.09*H, .68*H);
  L.hipY = lerp(L.crotchY, L.waistY, .4);
  L.neckY = clamp(L.waistY + m.torsoLength, L.waistY+.19*H, .875*H);
  L.shoulderY = L.neckY - .03*H;
  L.chestY = Math.max(L.shoulderY - .095*H, L.waistY + .1*H);
  L.ubY = lerp(L.waistY, L.chestY, .62);
  L.armpitY = L.shoulderY - .05*H;
  L.headC = H - .066*H;
  const R = c => c/CF;
  const rHip = R(m.hip), rWaist = R(m.waist), rChest = R(m.chest), rUb = R(m.underbust);
  const rNeck = m.neck/(2*Math.PI);
  const rShoulder = Math.max(m.shoulder/2 - .012*H, rChest*.95);
  const torsoPts = [
    [L.crotchY - .012*H, rHip*.86],
    [L.hipY, rHip],
    [lerp(L.hipY, L.waistY, .55), lerp(rHip, rWaist, .62)],
    [L.waistY, rWaist],
    [L.ubY, Math.max(rUb, rWaist)],
    [L.chestY, rChest],
    [L.armpitY, rChest*.98],
    [L.shoulderY - .01*H, rShoulder*.9],
    [L.shoulderY + .008*H, rNeck*1.75],
    [L.neckY, rNeck*1.12],
  ];
  const bust = prof.shape==='f' ? Math.max(0, (m.chest - m.underbust)/ (2*Math.PI) * 0.9) : 0;
  const rThigh = m.thigh/(2*Math.PI), rKnee = m.knee/(2*Math.PI), rCalf = m.calf/(2*Math.PI), rAnkle = m.ankle/(2*Math.PI);
  const legX = Math.max(rHip - rThigh*.92, rThigh*.78);
  const legPts = [
    [L.crotchY + .03*H, rThigh*1.04],
    [L.crotchY - .02*H, rThigh],
    [lerp(L.crotchY, L.kneeY, .55), lerp(rThigh, rKnee, .6)],
    [L.kneeY + .02*H, rKnee*1.02],
    [L.kneeY - .02*H, rKnee*.98],
    [L.kneeY - .09*H, rCalf],
    [lerp(L.kneeY, L.ankleY, .7), lerp(rCalf, rAnkle, .75)],
    [L.ankleY, rAnkle],
    [.012*H, rAnkle*1.05],
  ].sort((a,b)=>a[0]-b[0]);
  const rUpper = m.upperArm/(2*Math.PI), rWrist = m.wrist/(2*Math.PI);
  const armLen = m.armLength;
  const armPts = [ [0, rUpper*1.15], [.22*armLen, rUpper], [.46*armLen, rUpper*.8], [.62*armLen, lerp(rUpper, rWrist, .45)], [armLen, rWrist] ];
  const shoulderJoint = {x: rShoulder - rUpper*.55, y: L.shoulderY - .02*H};
  return {m, estimated, L, H, torsoPts, legPts, armPts, legX, armLen, shoulderJoint, armAngle:.2, bust, rNeck, rChest, rWaist, rHip,
    torsoRx(y){ return interp(torsoPts, y); },
    kAt(y){ return y > L.shoulderY ? lerp(K_TORSO, .95, clamp((y-L.shoulderY)/(L.neckY-L.shoulderY),0,1)) : K_TORSO; },
    bustAt(y, a){ if (!bust) return 0; const g = Math.exp(-Math.pow((y-L.chestY)/(.045*H),2)); const c = Math.max(0, Math.cos(a)); return bust*g*c*c; },
    legR(y){ return interp(legPts, y); },
    armR(t){ return interp(armPts, t); },
  };
}
function interp(pts, y){
  if (y <= pts[0][0]) return pts[0][1];
  for (let i=1;i<pts.length;i++){ if (y <= pts[i][0]){ const [y0,r0]=pts[i-1],[y1,rr]=pts[i]; return lerp(r0, rr, smooth((y-y0)/(y1-y0||1))); } }
  return pts[pts.length-1][1];
}

/* ---------- garment length keywords → heights on this body ---------- */
function hemY(B, length, template){
  const L = B.L, H = B.H;
  const map = {cropped:L.waistY+.04*H, waist:L.waistY-.01*H, hip:L.hipY-.03*H, thigh:L.crotchY-.08*H, knee:L.kneeY-.01*H, midi:L.kneeY-.1*H, ankle:L.ankleY+.03*H, floor:.015*H};
  let y = map[length] ?? map.hip;
  if (['bottom','skirt','suit'].includes(template) && length==='hip') y = map.floor;
  return y;
}

/* ---------- fitting service ----------
   Inputs: a body profile, a garment spec, an optional size chart (library garments).
   Output: per-zone ease, status, recommended size, missing data and confidence. */
function zoneWindow(t, zone, fabric, body){
  const st = (FABRICS[fabric]||{}).stretch || 0;
  const neg = -body*st/100*.5;
  const W = {
    bottom:{waist:[0,6], hip:[1,14], thigh:[2,30]}, skirt:{waist:[0,6], hip:[1,24]},
    dress:{chest:[3,30], waist:[2,30], hip:[3,40]}, robe:{chest:[10,90], waist:[10,120], hip:[10,140]},
  }[t];
  const base = (W && W[zone]) || (EASE_OK[t]||[4,30]);
  return [base[0] + neg, base[1]];
}
function targetEase(spec){
  const t = spec.template==='suit' ? 'jacket' : spec.template;
  if (spec.fit==='custom') return [spec.customEase.chest, spec.customEase.waist, spec.customEase.hip];
  return ((EASE[t]||EASE.top)[spec.fit]) || EASE.top.regular;
}
function computeFit(prof, spec, sizes, forcedSize){
  const B = bodyGeom(prof);
  const m = B.m;
  const t = spec.template;
  const req = REQ[t] || REQ.top;
  const provided = prof.m || {};
  const missing = req.filter(k => provided[k]==null || provided[k]==='' || isNaN(provided[k]));
  const zonesFor = {top:['chest','waist','hip'], tee:['chest','waist','hip'], hoodie:['chest','waist','hip'], jacket:['chest','waist','hip'], dress:['chest','waist','hip'], robe:['chest','hip'],
                    bottom:['waist','hip','thigh'], skirt:['waist','hip'], suit:['chest','waist','hip','thigh']}[t] || ['chest','waist','hip'];
  const te = targetEase(spec);
  const tgt = {chest:te[0], waist:te[1], hip:te[2], thigh: spec.legShape==='skinny'?2: spec.legShape==='wide'?14:7};
  if (['bottom','skirt'].includes(t)){ const eb = (EASE[t][spec.fit]||EASE[t].regular); tgt.waist = eb[1]; tgt.hip = eb[2]; }
  const evalSize = (chart) => {
    const zones = zonesFor.map(z => {
      const body = m[z];
      const g = chart ? chart[z] : body + (tgt[z] ?? 8);
      const ease = g==null ? null : g - body;
      const tz = (t==='suit' && z!=='chest' && z!=='thigh') ? 'jacket' : t;
      const [mn, mx] = zoneWindow(tz==='suit'?'jacket':tz, z, spec.fabric, body);
      let status = 'ok';
      if (ease==null) status='unknown'; else if (ease < mn) status = ease < 0 ? 'tight' : 'snug'; else if (ease > mx) status='loose';
      return {k:z, body, garment:g, ease, status, min:mn, max:mx};
    });
    let score = 0;
    for (const z of zones){ if (z.ease==null) continue; if (z.ease < z.min) score += (z.min-z.ease)*4; else if (z.ease > z.max) score += (z.ease-z.max); score += Math.abs(z.ease - (tgt[z.k]??8))*0.08; }
    return {zones, score};
  };
  let size = null, res;
  if (sizes && Object.keys(sizes).length){
    const ranked = Object.entries(sizes).map(([s,chart])=>({s, ...evalSize(chart)})).sort((a,b)=>a.score-b.score);
    const pick = forcedSize && sizes[forcedSize] ? ranked.find(r=>r.s===forcedSize) : ranked[0];
    size = pick.s; res = pick; res.recommended = ranked[0].s;
  } else {
    res = evalSize(null); res.recommended = null;
  }
  const lengths = [];
  if (sizes && size && sizes[size].sleeve && provided.armLength){ const d = sizes[size].sleeve - m.armLength; lengths.push({k:'Sleeve', body:m.armLength, garment:sizes[size].sleeve, diff:d, status: d<-2?'short': d>4?'long':'ok'}); }
  if (sizes && size && sizes[size].inseam && provided.inseam){ const d = sizes[size].inseam - m.inseam; lengths.push({k:'Inseam', body:m.inseam, garment:sizes[size].inseam, diff:d, status: d<-2?'short': d>4?'long':'ok'}); }
  const bad = res.zones.filter(z=>z.status==='tight').length;
  const warn = res.zones.filter(z=>z.status==='snug'||z.status==='loose').length + lengths.filter(l=>l.status!=='ok').length;
  const confidence = missing.length ? 'low' : (prof.verified ? 'high' : 'medium');
  const circ = {}; for (const z of res.zones) circ[z.k] = Math.max(z.garment ?? z.body, z.body + .6);
  return {size, recommended:res.recommended, zones:res.zones, lengths, missing, estimated:B.estimated, confidence,
    verdict: bad ? 'tight' : warn ? 'check' : 'good', circ, mode: sizes ? 'size-chart' : 'made-to-measure'};
}

/* Output level a design has reached, and what is missing for the next. */
function designLevel(design, prof){
  const spec = design.spec;
  const levels = [
    {k:'concept', label:'Concept', ok:true},
    {k:'preview', label:'3D preview', ok: TEMPLATES.includes(spec.template)},
    {k:'fit', label:'Estimated fit', ok:false, need:[]},
    {k:'production', label:'Production-ready', ok:false, need:[]},
  ];
  if (!prof){ levels[2].need.push('Choose a body profile'); }
  else {
    const req = REQ[spec.template]||[]; const miss = req.filter(k => prof.m?.[k]==null);
    if (miss.length) levels[2].need.push('Add '+miss.map(k=>MBYK[k]?.label.toLowerCase()).join(', '));
    else levels[2].ok = levels[1].ok;
  }
  const share = Object.values(Store.myShares.items||{}).find(s => s.designId===design.id);
  if (!levels[2].ok) levels[3].need.push('Reach estimated fit first');
  if (prof && !prof.verified) levels[3].need.push('Confirm measurements were taken with a tape (My Body → Verify)');
  if (!share) levels[3].need.push('Send to a tailor for pattern review');
  else if (!share.patternValidated) levels[3].need.push('Tailor has not validated the pattern yet');
  if (share && share.designVersion && share.designVersion !== (design.versions||[]).length) levels[3].need.push('Design changed since the tailor validated it');
  levels[3].ok = levels[2].ok && levels[3].need.length===0;
  let cur = 0; levels.forEach((l,i)=>{ if (l.ok) cur=i; });
  return {levels, cur};
}

/* ================= 3D VIEWER =================
   One WebGL renderer, moved between views. Avatar and garments are parametric
   shells generated from the body model in fit.js (units: centimetres). */
const Viewer = {
  ok:false, failed:false, renderer:null, scene:null, camera:null,
  host:null, canvas:null, tagsEl:null,
  avatar:null, groupA:null, groupB:null, tape:null, deco:null,
  cfg:null, keyAvatar:'', keyA:'', keyB:'',
  cam:{az:.45, el:.06, dist:300, taz:.45, tel:.06, tdist:300, ty:95, target:null},
  auto:false, dirty:true, ptrs:new Map(), lastPinch:0, raf:0, ro:null, tagData:[],

  init(){
    if (this.ok || this.failed) return this.ok;
    if (!window.THREE){ this.failed = true; return false; }
    try {
      const r = new THREE.WebGLRenderer({antialias:true, alpha:true});
      r.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      r.outputEncoding = THREE.sRGBEncoding;
      r.setClearColor(0x000000, 0);
      this.renderer = r; this.canvas = r.domElement;
      this.canvas.setAttribute('aria-label','3D fitting view. Drag to rotate, scroll or pinch to zoom, double-click to recentre.');
      this.canvas.setAttribute('role','img');
      this.scene = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(28, 1, 5, 4000);
      this.cam.target = new THREE.Vector3(0,95,0);
      const hemi = new THREE.HemisphereLight(0xfff6ea, 0x5a5248, .85); this.scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, .95); key.position.set(160,260,240); this.scene.add(key);
      const rim = new THREE.DirectionalLight(0xdfe6ff, .55); rim.position.set(-220,180,-200); this.scene.add(rim);
      const fill = new THREE.DirectionalLight(0xfff0dd, .25); fill.position.set(-200,80,200); this.scene.add(fill);
      this.deco = this.makeTurntable(); this.scene.add(this.deco);
      this.groupA = new THREE.Group(); this.groupB = new THREE.Group(); this.scene.add(this.groupA, this.groupB);
      this.bindControls();
      this.ok = true;
      const loop = () => { this.raf = requestAnimationFrame(loop); this.tick(); };
      loop();
      return true;
    } catch(e){ console.warn('WebGL unavailable', e); this.failed = true; return false; }
  },
  lin(hex){ return new THREE.Color(hex).convertSRGBToLinear(); },

  makeTurntable(){
    const g = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.CircleGeometry(48, 64), new THREE.MeshStandardMaterial({color:this.lin('#8a8070'), roughness:1, transparent:true, opacity:.16}));
    disc.rotation.x = -Math.PI/2; disc.position.y = .2; g.add(disc);
    const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
    const grd = x.createRadialGradient(64,64,4,64,64,64); grd.addColorStop(0,'rgba(0,0,0,.42)'); grd.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = grd; x.fillRect(0,0,128,128);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(70,46), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false}));
    sh.rotation.x = -Math.PI/2; sh.position.y = .4; g.add(sh);
    const pts = [];
    for (let i=0;i<72;i++){ const a = i/72*Math.PI*2, long = i%9===0, r0 = long?43:45.5; pts.push(new THREE.Vector3(Math.sin(a)*r0,.5,Math.cos(a)*r0), new THREE.Vector3(Math.sin(a)*48,.5,Math.cos(a)*48)); }
    const ticks = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:this.lin('#D9A520'), transparent:true, opacity:.75}));
    g.add(ticks);
    return g;
  },

  /* ---------- mounting ---------- */
  attach(host){
    if (!host){ this.host = null; return; }
    if (!this.init()){
      if (!host.querySelector('.fallback')) host.insertAdjacentHTML('afterbegin', `<div class="fallback"><div class="stack s" style="align-items:center"><b>3D view unavailable</b><span>This device or browser could not start WebGL. Measurements, fit checks, patterns and materials all still work.</span></div></div>`);
      return;
    }
    this.host = host;
    host.prepend(this.canvas);
    this.tagsEl = host.querySelector('.tags');
    if (this.ro) this.ro.disconnect();
    this.ro = new ResizeObserver(()=>this.resize()); this.ro.observe(host);
    this.resize(); this.dirty = true;
  },
  resize(){
    if (!this.host) return;
    const w = this.host.clientWidth, h = this.host.clientHeight; if (!w||!h) return;
    this.renderer.setSize(w, h, false); this.dirty = true;
  },

  /* cfg: {profile, A:[items], B:[items]|null, small, autoRotate}
     item: {spec, circ, key} — garment spec plus fitted circumferences */
  setConfig(cfg){
    if (!this.init()) return;
    this.cfg = cfg;
    const prof = cfg.profile;
    const kAv = prof ? prof.id+'|'+prof.updatedAt+'|'+(prof.skin??2)+'|'+JSON.stringify(prof.m)+prof.shape : 'none';
    let B = null;
    if (prof){
      B = bodyGeom(prof);
      if (kAv !== this.keyAvatar){
        this.keyAvatar = kAv;
        if (this.avatar){ this.scene.remove(this.avatar); this.dispose(this.avatar); }
        this.avatar = this.buildAvatar(B, prof); this.scene.add(this.avatar);
        if (this.tape){ this.scene.remove(this.tape); this.dispose(this.tape); }
        this.tape = this.buildTape(B); this.scene.add(this.tape);
        const ty = B.H*.53; this.cam.ty = ty; this.cam.tdist = B.H*2.2; this.cam.target.y = ty; if (!this.camInit){ this.cam.dist = this.cam.tdist; this.camInit=true; }
      }
    } else if (this.avatar){ this.scene.remove(this.avatar); this.dispose(this.avatar); this.avatar=null; this.keyAvatar=''; }
    // imported body scan (session only): shown instead of, or over, the parametric avatar
    const sc = cfg.scan && S.scan ? S.scan : null;
    const kS = sc ? sc.id : '';
    if (kS !== this.keyScan){
      this.keyScan = kS;
      if (this.scanObj){ this.scene.remove(this.scanObj); this.dispose(this.scanObj); this.scanObj = null; }
      if (sc){ try { this.scanObj = this.buildScan(sc, prof); this.scene.add(this.scanObj); } catch(e){ console.warn('scan display failed', e); } }
    }
    const mode = sc ? (S.viewer.scanMode || 'scan') : 'avatar';
    if (this.scanObj){
      this.scanObj.visible = mode !== 'avatar';
      const m = this.scanObj.userData.mat; m.transparent = mode==='compare'; m.opacity = mode==='compare' ? .42 : 1; m.depthWrite = mode!=='compare'; m.needsUpdate = true;
      this.scanObj.userData.rings.visible = mode !== 'avatar';
      if (sc && !B){ const ty = sc.H*.53; this.cam.ty = ty; this.cam.tdist = sc.H*2.2; this.cam.target.y = ty; }
    }
    if (this.avatar) this.avatar.visible = mode !== 'scan';
    const kA = kAv + JSON.stringify((cfg.A||[]).map(i=>[i.spec,i.circ])) + this.fitMapKey();
    if (kA !== this.keyA){ this.keyA = kA; this.fill(this.groupA, B, cfg.A||[]); }
    const kB = kAv + JSON.stringify((cfg.B||[]).map(i=>[i.spec,i.circ])) + this.fitMapKey();
    if (kB !== this.keyB){ this.keyB = kB; this.fill(this.groupB, B, cfg.B||[]); }
    this.auto = !!cfg.autoRotate;
    if (this.tape) this.tape.visible = S.viewer.tape;
    this.groupA.visible = S.viewer.garmentsOn; this.groupB.visible = S.viewer.garmentsOn;
    this.B = B;
    this.dirty = true;
  },
  fitMapKey(){ return S.viewer.fitMap ? '|fm' : ''; },
  fill(group, B, items){
    for (const c of [...group.children]){ group.remove(c); this.dispose(c); }
    if (!B) return;
    const env = makeEnvelope();
    const ordered = [...items].sort((a,b)=>layerOf(a.spec)-layerOf(b.spec));
    for (const it of ordered){
      try { group.add(buildGarment(B, it, env)); } catch(e){ console.warn('garment build failed', e); }
    }
  },
  dispose(obj){
    obj.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m => m.dispose()); }
    });
  },

  /* ---------- avatar ---------- */
  buildAvatar(B, prof){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({color:this.lin(SKIN[prof.skin??2]||SKIN[2]), roughness:.78, metalness:0});
    const L = B.L, H = B.H;
    // torso
    g.add(new THREE.Mesh(shellGeo(40, 48, (v,u)=>{
      const y = lerp(L.neckY, L.crotchY - .015*H, v);
      const a = Math.PI + u*Math.PI*2, rx = B.torsoRx(y), rz = rx*B.kAt(y) + B.bustAt(y, a);
      return [Math.sin(a)*rx, y, Math.cos(a)*rz];
    }), mat));
    // neck + head
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(B.rNeck*.95, B.rNeck*1.05, (L.headC-.04*H)-(L.neckY-.02*H), 24), mat);
    neck.position.y = ((L.headC-.04*H)+(L.neckY-.02*H))/2; g.add(neck);
    const head = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), mat);
    head.scale.set(.052*H, .066*H, .06*H); head.position.set(0, L.headC, .004*H); g.add(head);
    // legs + feet
    for (const s of [-1,1]){
      g.add(new THREE.Mesh(shellGeo(36, 28, (v,u)=>{
        const y = lerp(L.crotchY + .03*H, .012*H, v); const a = Math.PI + u*Math.PI*2, r = B.legR(y);
        return [s*B.legX + Math.sin(a)*r, y, Math.cos(a)*r*.94];
      }), mat));
      const foot = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), mat);
      foot.scale.set(.028*H, .02*H, .075*H); foot.position.set(s*B.legX*1.04, .018*H, .035*H); g.add(foot);
    }
    // arms
    for (const s of [-1,1]){
      const arm = new THREE.Group();
      arm.add(new THREE.Mesh(shellGeo(30, 24, (v,u)=>{
        const t = v*B.armLen; const a = u*Math.PI*2, r = B.armR(t);
        return [Math.sin(a)*r, -t, Math.cos(a)*r*.92];
      }), mat));
      const cap = new THREE.Mesh(new THREE.SphereGeometry(B.armR(0)*1.02, 20, 14), mat); arm.add(cap);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), mat);
      hand.scale.set(.026*H, .055*H, .013*H*1.6); hand.position.set(0, -B.armLen - .045*H, 0); arm.add(hand);
      arm.position.set(s*B.shoulderJoint.x, B.shoulderJoint.y, 0); arm.rotation.z = s*B.armAngle;
      g.add(arm);
    }
    return g;
  },
  buildScan(sc, prof){
    const g = new THREE.Group();
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(sc.pos, 3));
    if (sc.idx) geo.setIndex(new THREE.BufferAttribute(sc.idx, 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({color:this.lin(SKIN[prof?.skin??2]||SKIN[2]), roughness:.85, metalness:0, side:THREE.DoubleSide});
    g.add(new THREE.Mesh(geo, mat));
    const rings = new THREE.Group(), lm = new THREE.LineBasicMaterial({color:this.lin('#9CC42B')});
    for (const r of sc.rings||[]){ if (!r.hull || r.hull.length<3) continue; rings.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(r.hull.map(([x,z])=>new THREE.Vector3(x, r.y+.05, z))), lm)); }
    g.add(rings);
    g.userData = {mat, rings};
    return g;
  },
  buildTape(B){
    const g = new THREE.Group(); const L = B.L;
    const mat = new THREE.LineBasicMaterial({color:this.lin('#D9A520')});
    this.tagData = [];
    const ring = (y, key, label, dx=0, rf=null) => {
      const pts=[]; for (let i=0;i<=64;i++){ const a=i/64*Math.PI*2; const rx = rf? rf(y): B.torsoRx(y)+.35, rz = rf? rf(y)*.94 : rx*B.kAt(y)+B.bustAt(y,a)+.35; pts.push(new THREE.Vector3(dx+Math.sin(a)*rx, y, Math.cos(a)*rz)); }
      g.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat));
      const rx0 = rf? rf(y) : B.torsoRx(y);
      this.tagData.push({p:new THREE.Vector3(dx+rx0+1, y, 0), key, label});
    };
    ring(L.chestY,'chest','Chest'); ring(L.waistY,'waist','Waist'); ring(L.hipY,'hip','Hip');
    ring(L.crotchY-.06*B.H,'thigh','Thigh', B.legX, y=>B.legR(y)+.35);
    return g;
  },

  /* ---------- camera + controls ---------- */
  view(name){
    const map = {front:0, back:Math.PI, left:Math.PI/2, right:-Math.PI/2, three:.62};
    if (name==='reset'){ this.cam.taz=.45; this.cam.tel=.06; this.cam.tdist = this.B? this.B.H*2.2 : 340; this.cam.target.y = this.cam.ty; }
    else { let t = map[name]; const cur = this.cam.az; while (t - cur > Math.PI) t -= Math.PI*2; while (cur - t > Math.PI) t += Math.PI*2; this.cam.taz = t; this.cam.tel = .05; }
    this.dirty = true;
  },
  zoom(f){ this.cam.tdist = clamp(this.cam.tdist*f, 80, 700); this.dirty = true; },
  bindControls(){
    const c = this.canvas;
    c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); this.auto = false; });
    c.addEventListener('pointermove', e => {
      if (!this.ptrs.has(e.pointerId)) return;
      const prev = this.ptrs.get(e.pointerId);
      if (this.ptrs.size === 1){
        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
        this.cam.taz -= dx*.009; this.cam.tel = clamp(this.cam.tel + dy*.006, -.35, .9);
      } else if (this.ptrs.size === 2){
        const [a,b] = [...this.ptrs.values()];
        const d0 = Math.hypot(a.x-b.x, a.y-b.y);
        this.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
        const [a2,b2] = [...this.ptrs.values()];
        const d1 = Math.hypot(a2.x-b2.x, a2.y-b2.y);
        if (d0>0) this.cam.tdist = clamp(this.cam.tdist * d0/d1, 80, 700);
        const my = ((a2.y+b2.y)-(a.y+b.y))/2; this.cam.target.y = clamp(this.cam.target.y + my*.25, 10, 190);
      }
      this.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
      this.dirty = true;
    });
    const up = e => { this.ptrs.delete(e.pointerId); };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    c.addEventListener('wheel', e => { e.preventDefault(); this.zoom(e.deltaY>0 ? 1.08 : 1/1.08); }, {passive:false});
    c.addEventListener('dblclick', () => this.view('reset'));
    c.tabIndex = 0;
    c.addEventListener('keydown', e => {
      const k = e.key; let used = true;
      if (k==='ArrowLeft') this.cam.taz += .2; else if (k==='ArrowRight') this.cam.taz -= .2;
      else if (k==='ArrowUp') this.cam.tel = clamp(this.cam.tel+.1,-.35,.9); else if (k==='ArrowDown') this.cam.tel = clamp(this.cam.tel-.1,-.35,.9);
      else if (k==='+'||k==='=') this.zoom(1/1.12); else if (k==='-') this.zoom(1.12); else if (k==='0') this.view('reset'); else used = false;
      if (used){ e.preventDefault(); this.dirty = true; }
    });
  },
  tick(){
    if (!this.host || !this.host.isConnected) return;
    const c = this.cam; let moving = false;
    if (this.auto){ c.taz += .006; moving = true; }
    for (const [k,t] of [['az','taz'],['el','tel'],['dist','tdist']]){ const d = c[t]-c[k]; if (Math.abs(d) > 1e-4){ c[k] += d*.16; moving = true; } else c[k]=c[t]; }
    const dy = c.ty - c.target.y; if (this.ptrs.size<2 && Math.abs(dy) > .01 && !this.userPanned){ /* keep user pan */ }
    if (!moving && !this.dirty) return;
    this.dirty = false;
    const cam = this.camera, T = c.target;
    cam.position.set(T.x + Math.sin(c.az)*Math.cos(c.el)*c.dist, T.y + Math.sin(c.el)*c.dist, T.z + Math.cos(c.az)*Math.cos(c.el)*c.dist);
    cam.lookAt(T);
    const r = this.renderer; const w = this.host.clientWidth, h = this.host.clientHeight;
    if (!w || !h) return;
    if (this.cfg && this.cfg.B){
      cam.aspect = (w/2)/h; cam.updateProjectionMatrix();
      r.setScissorTest(true);
      this.groupA.visible = S.viewer.garmentsOn; this.groupB.visible = false;
      r.setViewport(0,0,w/2,h); r.setScissor(0,0,w/2,h); r.render(this.scene, cam);
      this.groupA.visible = false; this.groupB.visible = S.viewer.garmentsOn;
      r.setViewport(w/2,0,w/2,h); r.setScissor(w/2,0,w/2,h); r.render(this.scene, cam);
      r.setScissorTest(false); this.groupA.visible = S.viewer.garmentsOn;
    } else {
      cam.aspect = w/h; cam.updateProjectionMatrix();
      r.setViewport(0,0,w,h); r.render(this.scene, cam);
    }
    this.drawTags(w, h);
  },
  drawTags(w, h){
    const el = this.tagsEl; if (!el) return;
    if (!S.viewer.tape || !this.tape || (this.cfg && this.cfg.B)){ if (el.childElementCount) el.innerHTML=''; return; }
    const m = this.B ? this.B.m : {};
    const html = this.tagData.map(t => {
      const p = t.p.clone().project(this.camera);
      if (p.z > 1) return '';
      const x = (p.x*.5+.5)*w, y = (-p.y*.5+.5)*h;
      return `<span class="tag" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px">${t.label} ${Units.show(m[t.key],1)}</span>`;
    }).join('');
    if (el.innerHTML !== html) el.innerHTML = html;
  },
};

/* ---------- geometry helpers ---------- */
function shellGeo(rows, segs, fn){
  const pos = [], uv = [], idx = [];
  for (let i=0;i<=rows;i++){
    for (let j=0;j<=segs;j++){
      const p = fn(i/rows, j/segs);
      pos.push(p[0], p[1], p[2]);
      uv.push(p[3] ?? j/segs, p[4] ?? i/rows);
    }
  }
  const W = segs+1;
  for (let i=0;i<rows;i++) for (let j=0;j<segs;j++){
    const a = i*W+j, b = a+1, c = a+W, d = c+1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function layerOf(spec){ return {bottom:0, skirt:0, tee:1, top:1, dress:1, hoodie:2, jacket:3, suit:3, robe:4}[spec.template] ?? 1; }
/* Envelope: the outer surface of garments already placed, so the next layer sits outside it. */
function makeEnvelope(){
  const rows = []; // {y0,y1,f(y)->[rx,rz]}
  const atRows = (rs, y) => { let rx=0, rz=0; for (const r of rs){ if (y<=r.y0 && y>=r.y1){ const v = r.f(y); rx=Math.max(rx,v[0]); rz=Math.max(rz,v[1]); } } return [rx,rz]; };
  return {
    at(y){ return atRows(rows, y); },
    add(y0, y1, f){ rows.push({y0, y1, f}); },
    /* a snapshot of the layers placed so far, so a garment never measures against itself */
    frozen(){ const snap = rows.slice(); return {at:y=>atRows(snap, y)}; },
  };
}

/* ---------- print textures (scaled in real centimetres) ---------- */
const TEX = new Map();
function printTexture(print, base, ink){
  const key = print+base+ink;
  if (TEX.has(key)) return TEX.get(key);
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');

const FIT_COLORS = {ok:'#3E9B6E', snug:'#D99A2B', tight:'#C9452F', loose:'#4A7FC4', unknown:'#9a9a9a'};

/* ---------- garment builder ---------- */
function buildGarment(B, it, envAll){
  const env = envAll.frozen();
  const spec = it.spec, L = B.L, H = B.H, t = spec.template, circ = it.circ || {};
  const g = new THREE.Group();
  const m = B.m, gap = .7;
  const eC = (circ.chest ?? m.chest+10) - m.chest, eW = (circ.waist ?? m.waist+10) - m.waist, eH = (circ.hip ?? m.hip+10) - m.hip;
  const zStatus = it.zones ? Object.fromEntries(it.zones.map(z=>[z.k, z.status])) : {};
  const easeR = y => interp([[L.crotchY, eH],[L.hipY, eH],[L.waistY, eW],[L.chestY, eC],[L.armpitY, eC*.7],[L.shoulderY, 1.2],[L.neckY, 1.2]], y) / CF;
  const zoneAt = y => y > (L.chestY+L.waistY)/2 ? 'chest' : y > (L.waistY+L.hipY)/2 ? 'waist' : 'hip';
  const colorFor = (y, legs) => new THREE.Color(FIT_COLORS[zStatus[legs ? 'thigh' : zoneAt(y)] || 'ok']).convertSRGBToLinear();
  const isTop = ['top','tee','hoodie','jacket','dress','robe','suit'].includes(t);
  const isBottom = ['bottom','suit'].includes(t);
  const mat = fabricMat(spec);
  const solidMat = zone => S.viewer.fitMap ? new THREE.MeshStandardMaterial({color:Viewer.lin(FIT_COLORS[zStatus[zone]||'ok']), roughness:.8, side:THREE.DoubleSide}) : mat;
  const tileCm = 26;

  // ----- torso shell (tops, dresses, robes, jackets) -----
  if (isTop){
    const hem = t==='suit' ? hemY(B, spec.length==='hip'?'hip':spec.length, 'jacket') : hemY(B, spec.length, t);
    const flare = t==='robe' ? .16 : 0;
    const skirtFlare = {pencil:.02, 'a-line':.2, flared:.42, gathered:.32, wrap:.22}[spec.skirtShape] ?? .2;
    const isDress = t==='dress';
    const neckDrop = a => {

        case 'v-neck': return .12*H*Math.max(0, 1-Math.abs(aw)/.75);

        case 'boat': return .025*H*Math.pow(c,.5);
        case 'notch-lapel': case 'peak-lapel': case 'shawl': return Math.max(0, (L.neckY-(L.waistY+.03*H)))*Math.max(0,1-Math.abs(aw)/.5);

    const topY = a => L.neckY + .004*H - neckDrop(a);
    const R = (y, a) => {
      let rx, rz;
      if (y >= L.crotchY || !(isDress || t==='robe' || t==='jacket' || t==='suit')){
        const yy = Math.max(y, L.crotchY);
        rx = B.torsoRx(yy) + Math.max(easeR(yy), .35);
        rz = (B.torsoRx(yy) + Math.max(easeR(yy), .35))*B.kAt(yy) + B.bustAt(yy, a)*.9;
      } else {
        const lr = B.legR(y), ex = Math.max(eH/CF, 1.2);

      }

      if (flare && y < L.hipY){ const d = L.hipY - y; rx += d*flare; rz += d*flare*.85; }

      const e = env.at(y); rx = Math.max(rx, e[0] ? e[0]+gap : 0); rz = Math.max(rz, e[1] ? e[1]+gap : 0);

      if (y < L.hipY && (isDress || t==='robe' || t==='skirt')){ const amp = (L.hipY-y)*.02*dr*(spec.skirtShape==='gathered'?2.2:1); rx += Math.sin(a*14)*amp; rz += Math.sin(a*14)*amp; }
      return [rx, rz];
    };
    const rows = 70, segs = 64;
    const colors = [];
    const avgC = 2*Math.PI*B.torsoRx(L.waistY)*1.1;
    const geo = shellGeo(rows, segs, (v,u) => {
      const a = Math.PI + u*Math.PI*2;

      colors.push(colorFor(y));

    });
    if (S.viewer.fitMap){ const arr = []; colors.forEach(c=>arr.push(c.r,c.g,c.b)); geo.setAttribute('color', new THREE.Float32BufferAttribute(arr,3)); }
    g.add(new THREE.Mesh(geo, mat));
    envAll.add(L.neckY+5, hem-1, y => R(y, 0));

    // sleeves

        const arm = new THREE.Group();
        const sg = shellGeo(26, 28, (v,u) => {
          const tt = -2 + v*(len+2); const a = u*Math.PI*2;
          let r = B.armR(Math.max(tt,0)) + sEase + (t==='jacket'||t==='suit'?1:0) + (layerOf(spec)>=3?1.2:0);
          if (spec.sleeve==='wide') r = B.armR(0)+3 + Math.pow(v,1.3)*.17*H;
          if (t==='robe' && spec.sleeve!=='wide') r += v*2.5;
          return [Math.sin(a)*r, -tt, Math.cos(a)*r*.94, u*2*Math.PI*r/tileCm, tt/tileCm];
        });
        if (S.viewer.fitMap){ const n = sg.attributes.position.count, arr=[]; const cc = new THREE.Color(FIT_COLORS[zStatus.chest||'ok']).convertSRGBToLinear(); for(let i=0;i<n;i++) arr.push(cc.r,cc.g,cc.b); sg.setAttribute('color', new THREE.Float32BufferAttribute(arr,3)); }

        const capR = B.armR(0) + sEase + .6;
        const cap = new THREE.Mesh(new THREE.SphereGeometry(capR, 22, 14, 0, Math.PI*2, 0, Math.PI*.55), solidMat('chest')); arm.add(cap);

        }

          g.add(triMesh(pts, trimMat));
        }
      }

        const tip = spec.collar==='peak-lapel' ? new THREE.Vector3(s*(B.rChest*.72), L.chestY+.075*H, R(L.chestY,s*.7)[1]*.85+.9) : null;

      g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false), 80, spec.embroidery==='neckline'?.9:.4, 6), new THREE.MeshStandardMaterial({color:Viewer.lin(ec), roughness:.4, metalness:.3})));
      if (spec.embroidery==='neckline' && t==='robe'){ // chest panel embroidery typical of agbada

        g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts2), 60, .7, 6), new THREE.MeshStandardMaterial({color:Viewer.lin(ec), roughness:.4, metalness:.3})));
