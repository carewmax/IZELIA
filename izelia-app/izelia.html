/* ================= VIEWS: wardrobe, garment, outfits, workshop ================= */
function slotOf(spec){ return {bottom:['bottom'], skirt:['bottom'], top:['top'], tee:['top'], dress:['top','bottom'], hoodie:['outer'], jacket:['outer'], suit:['outer','bottom'], robe:['robe']}[spec.template] || ['top']; }

function viewWardrobe(){
  S.vcfg = null;
  const w = S.wardrobe;
  const fav = S.settings.favourites || [];
  let list = garmentsPub();
  if (Store.canPublish()) list = garmentsAll().filter(g=>g.status!=='archived');
  const tabs = [['all','All garments'],['new','New arrivals'],['fav','Favourites'],['recent','Recently viewed'],['mine','My designs'],['outfits','Outfits']];
  if (w.tab==='new'){ const t = S.settings.lastSeenGarmentsAt; list = list.filter(g=>!t || g.createdAt > t || (Date.now()-new Date(g.createdAt))<14*864e5); }
  if (w.tab==='fav') list = list.filter(g=>fav.includes(g.id));
  if (w.tab==='recent') list = (S.settings.recent||[]).map(id=>getGarment(id)).filter(Boolean);
  const q = w.q.trim().toLowerCase();
  if (q) list = list.filter(g => (g.name+' '+g.description+' '+(g.tags||[]).join(' ')+' '+(CAT[g.category]?.label||'')+' '+(g.designer||'')).toLowerCase().includes(q));
  if (w.cat) list = list.filter(g=>g.category===w.cat);
  if (w.color) list = list.filter(g=>(g.colors||[]).some(c=>c.n===w.color));
  if (w.fabric) list = list.filter(g=>g.spec.fabric===w.fabric);
  if (w.fit) list = list.filter(g=>g.spec.fit===w.fit);
  if (w.designer) list = list.filter(g=>g.designer===w.designer);
  if (w.maxPrice) list = list.filter(g=>g.price==null || g.price <= +w.maxPrice);
  if (w.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if (w.sort==='price') list.sort((a,b)=>(a.price??1e12)-(b.price??1e12));
  if (w.sort==='new') list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  if (w.sort==='fit'){ const p = activeProfile(); if (p) list.sort((a,b)=>score(a)-score(b)); function score(g){ const f = fitItemForGarment(p,g).fit; return f.verdict==='good'?0:f.verdict==='check'?1:2; } }
  const all = garmentsAll();
  const colors = [...new Set(all.flatMap(g=>(g.colors||[]).map(c=>c.n)))].sort();
  const fabrics = [...new Set(all.map(g=>g.spec.fabric))];
  const designers = [...new Set(all.map(g=>g.designer).filter(Boolean))];
  const p = activeProfile();
  let content;
  if (w.tab==='mine'){
    const ds = designs();
    content = ds.length ? `<div class="cards">${ds.map(d=>`<div class="gcard" role="button" tabindex="0" data-a="openDesign" data-id="${d.id}"><div class="flat">${flatSVG(d.spec,'front')}${d.template?'<span class="chip badge">Template</span>':''}</div><div class="meta"><b>${esc(d.name)}</b><span>${esc(CAT[d.spec.category]?.label||'')} · v${d.versions.length}</span></div></div>`).join('')}</div>` : `<div class="empty"><h3>No designs yet</h3><button class="btn sm" data-a="go" data-r="create">Create one</button></div>`;
  } else if (w.tab==='outfits'){
    const os = Object.values(Store.private.outfits);
    content = os.length ? `<div class="cards">${os.map(o=>outfitCard(o)).join('')}</div>` : `<div class="empty"><h3>No outfits yet</h3><p>Open a garment and choose “Add to outfit”, then combine pieces and save.</p></div>`;
  } else {
    content = list.length ? `<div class="cards">${list.map(g=>garmentCard(g)).join('')}</div>` : `<div class="empty"><h3>No garments match</h3><p>Try clearing a filter.</p><button class="btn sm" data-a="clearFilters">Clear filters</button></div>`;
  }
  return `
  <div class="page-head">
    <div><h1>Virtual Wardrobe</h1><p>${p ? `Every garment opens on <b>${esc(p.name)}</b>'s saved avatar. No new scan needed.` : 'Add a body profile to try garments on your own avatar. Until then garments show on a reference size M body.'}</p></div>
    ${Store.canPublish()?'<button class="btn" data-a="tailorNewGarment">'+ic('plus')+'Add garment</button>':''}
  </div>
  ${outfitTray()}
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${w.tab===k}" data-a="wardTab" data-t="${k}">${l}${k==='new'&&newGarments().length&&S.settings.lastSeenGarmentsAt?` <span class="chip tape">${newGarments().length}</span>`:''}</button>`).join('')}</div>
  ${['mine','outfits'].includes(w.tab) ? '' : `<div class="form-grid" style="margin-bottom:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
    <label class="field">Search<input type="search" id="w-q" data-in="wq" value="${esc(w.q)}" placeholder="Name, style, tag"></label>
    <label class="field">Category<select id="w-cat" data-ch="wf" data-k="cat"><option value="">All</option>${CATEGORIES.filter(c=>all.some(g=>g.category===c.k)).map(c=>`<option value="${c.k}" ${w.cat===c.k?'selected':''}>${c.label}</option>`).join('')}</select></label>
    <label class="field">Colour<select id="w-color" data-ch="wf" data-k="color"><option value="">All</option>${colors.map(c=>`<option ${w.color===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="field">Fabric<select id="w-fabric" data-ch="wf" data-k="fabric"><option value="">All</option>${fabrics.map(f=>`<option value="${f}" ${w.fabric===f?'selected':''}>${FABRICS[f]?.name||f}</option>`).join('')}</select></label>
    <label class="field">Fit<select id="w-fit" data-ch="wf" data-k="fit"><option value="">All</option>${OPTIONS.fit.filter(f=>f!=='custom').map(f=>`<option value="${f}" ${w.fit===f?'selected':''}>${optLabel(f)}</option>`).join('')}</select></label>
    <label class="field">Tailor / designer<select id="w-des" data-ch="wf" data-k="designer"><option value="">All</option>${designers.map(d=>`<option ${w.designer===d?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
    <label class="field">Max price<input type="number" id="w-price" data-ch="wf" data-k="maxPrice" value="${esc(w.maxPrice)}" placeholder="Any"></label>
    <label class="field">Sort<select id="w-sort" data-ch="wf" data-k="sort">${[['new','Newest'],['name','Name'],['price','Price'],['fit','Best fit for me']].map(([k,l])=>`<option value="${k}" ${w.sort===k?'selected':''}>${l}</option>`).join('')}</select></label>
  </div>`}
  ${content}`;
}
function outfitTray(){
  if (!S.outfitDraft.length) return '';
  return `<div class="panel" style="margin-bottom:16px;padding:12px 16px"><div class="spread"><div class="row tight"><b style="font-size:14px">Outfit in progress</b>${S.outfitDraft.map(it=>{ const g = getGarment(it.g); return g?`<span class="chip">${esc(g.name)} <button class="btn sm ghost icon" style="min-height:20px;width:20px" data-a="outfitRemove" data-id="${g.id}" aria-label="Remove ${esc(g.name)}">${ic('x','style="width:12px;height:12px"')}</button></span>`:''; }).join('')}</div><div class="row tight"><button class="btn sm primary" data-a="openOutfit" data-id="draft">Try on together</button><button class="btn sm ghost" data-a="outfitClear">Clear</button></div></div></div>`;
}

/* ---------- garment detail (try-on) ---------- */
function viewGarment(){
  const g = getGarment(S.params.id);
  if (!g){ S.vcfg = null; return `<div class="empty"><h3>This garment is no longer in the library</h3><p>It may have been archived or deleted.</p><button class="btn" data-a="go" data-r="wardrobe">Back to wardrobe</button></div>`; }
  const p = activeProfile() || REF_PROFILE;
  const gv = S.gview && S.gview.id===g.id ? S.gview : (S.gview = {id:g.id, size:null, color:g.colors?.[0]?.h || g.spec.color, compare:null});
  const it = fitItemForGarment(p, g, gv.size, gv.color);
  const fit = it.fit;
  const B = gv.compare ? [fitItemForGarment(p, g, gv.size, gv.compare)] : null;
  S.vcfg = {profile:p, A:[it], B};
  const verdict = {good:['ok','Good fit'], check:['warn','Check the details'], tight:['bad','Too tight in places']}[fit.verdict];
  const fav = (S.settings.favourites||[]).includes(g.id);
  const sizes = Object.keys(g.sizes||{});
  const colorName = (g.colors||[]).find(c=>c.h===gv.color)?.n || '';
  const modeTxt = (g.fitModes||[]).includes('estimated') ? 'Estimated fit: the garment’s size chart is compared zone by zone with your measurements and drawn on your parametric avatar.' : 'Preview only: this garment lacks a complete size chart, so only a visual preview is shown.';
  return `
  <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-a="go" data-r="wardrobe">${ic('back')}Wardrobe</button></div>
  ${outfitTray()}
  <div class="studio">
    ${stageHTML({hud:`<span class="chip">${esc(p.name)}</span>${p.ref?'<span class="chip warn">Reference body</span>':''}<span class="chip">Size ${esc(fit.size||'—')}</span>${fit.cached?'<span class="chip demo">Cached fit</span>':''}`, compare: B ? [colorName, (g.colors||[]).find(c=>c.h===gv.compare)?.n || 'Compare'] : null})}
    <div class="side">
      <section class="panel stack">
        <div class="stack s">
          <div class="row tight">${g.demo?'<span class="chip demo">Studio template</span>':''}${g.fromStore?'<span class="chip accent">IZELIA product</span>':''}${g.status!=='published'?`<span class="chip warn">${esc(g.status)}</span>`:''}<span class="chip">v${g.version}</span></div>
          <h1 class="display" style="font-size:32px">${esc(g.name)}</h1>
          <span class="faint" style="font-size:13px">${esc(CAT[g.category]?.label||'')} · ${esc(g.designer||'')} ${g.price?`· ${money(g.price,g.currency)}`:''}</span>
          <p class="muted" style="font-size:14.5px">${esc(g.description)}</p>
        </div>
        ${(g.colors||[]).length ? `<div class="ctl"><span class="lbl">Colour · ${esc(colorName)}</span><div class="swatches">${g.colors.map(c=>`<button class="sw" style="background:${c.h}" data-a="gColor" data-v="${c.h}" aria-pressed="${gv.color===c.h}" aria-label="${esc(c.n)}" title="${esc(c.n)}"></button>`).join('')}</div></div>`:''}
        ${sizes.length ? `<div class="ctl"><span class="lbl">Size</span><div class="opts">${sizes.map(s=>`<button class="opt" data-a="gSize" data-v="${s}" aria-pressed="${fit.size===s}">${s}${fit.recommended===s?' ★':''}</button>`).join('')}</div><span class="faint" style="font-size:12.5px">★ recommended for ${esc(p.name)}</span></div>`:''}
        <div class="row">
          <button class="btn ${fav?'primary':''}" data-a="toggleFav" data-id="${g.id}" aria-pressed="${fav}">${ic('heart', fav?'fill="currentColor"':'')}${fav?'Saved':'Favourite'}</button>
          <button class="btn" data-a="outfitAdd" data-id="${g.id}">Add to outfit</button>
          <button class="btn" data-a="customiseGarment" data-id="${g.id}">${ic('create')}Customise</button>
        </div>
      </section>
      <section class="panel stack">
        <div class="spread"><h2>Fit</h2><span class="chip ${verdict[0]}">${verdict[1]}</span></div>
        ${fitTable(fit)}
        ${fit.missing.length && !p.ref ? `<div class="note warn">${fit.missing.map(k=>MBYK[k].label).join(', ')} ${fit.missing.length>1?'are':'is'} estimated. Add ${fit.missing.length>1?'them':'it'} in My Body for a better check.</div>`:''}
        ${p.ref ? `<div class="note warn">Showing a reference size M body. <button class="btn sm" data-a="newProfile" style="margin-top:6px">Add your measurements</button></div>`:''}
        <div class="spread"><span style="font-weight:600;font-size:14px">Fit map</span><button class="btn sm ${S.viewer.fitMap?'primary':''}" data-a="vtool" data-t="fitMap">${S.viewer.fitMap?'On':'Off'}</button></div>
        ${fitLegend()}
        <p class="faint" style="font-size:12.5px">${modeTxt} Not a cloth simulation; comfort and final fit are not guaranteed.</p>
      </section>
      ${(g.colors||[]).length>1 ? `<section class="panel stack s"><h3>Compare colours</h3><div class="opts">${g.colors.filter(c=>c.h!==gv.color).map(c=>`<button class="opt" data-a="gCompare" data-v="${c.h}" aria-pressed="${gv.compare===c.h}">${esc(c.n)}</button>`).join('')}${gv.compare?'<button class="opt" data-a="gCompare" data-v="">Stop</button>':''}</div></section>`:''}
      <section class="panel stack s">
        <div class="row"><button class="btn sm" data-a="garmentWorkshop" data-id="${g.id}">Materials and pattern</button>${Store.canPublish()? (g.fromStore ? `<button class="btn sm" data-a="productEdit" data-id="${g.productId}">Edit product fitting</button>` : `<button class="btn sm" data-a="tailorEditGarment" data-id="${g.id}">Edit garment</button>`):''}${g.fromStore?`<button class="btn sm" data-a="openProduct" data-id="${g.productId}">Shop this piece</button>`:''}</div>
        ${S.settings.technical && sizes.length ? `<div class="scroll-x"><table class="data"><thead><tr><th>Size</th>${Object.keys(g.sizes[sizes[0]]).map(k=>`<th class="num">${optLabel(k)}</th>`).join('')}</tr></thead><tbody>${sizes.map(s=>`<tr><td>${s}</td>${Object.values(g.sizes[s]).map(v=>`<td class="num mono">${Units.show(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="faint" style="font-size:12px">Garment measurements (finished), not body measurements.</p>`:''}
      </section>
    </div>
  </div>`;
}

/* ---------- outfit view ---------- */
function viewOutfit(){
  const id = S.params.id;
  const o = id==='draft' ? {id:'draft', name:'New outfit', items:S.outfitDraft, profileId:activeProfile()?.id} : Store.private.outfits[id];
  if (!o){ S.vcfg=null; return `<div class="empty"><h3>Outfit not found</h3><button class="btn" data-a="go" data-r="wardrobe">Back</button></div>`; }
  const p = Store.private.profiles[o.profileId] || activeProfile() || REF_PROFILE;
  const items = o.items.map(it=>{ const g = getGarment(it.g); return g ? {g, ...fitItemForGarment(p, g, it.size, it.color)} : null; }).filter(Boolean);
  S.vcfg = {profile:p, A:items};
  const missing = o.items.filter(it=>!getGarment(it.g)).length;
  const order = [...items].sort((a,b)=>layerOf(a.spec)-layerOf(b.spec));
  return `
  <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-a="wardTab" data-t="outfits">${ic('back')}Outfits</button></div>
  <div class="studio">
    ${stageHTML({hud:`<span class="chip">${esc(p.name)}</span><span class="chip">${items.length} pieces</span>`})}
    <div class="side">
      <section class="panel stack">
        <label class="field">Outfit name<input type="text" id="of-name" value="${esc(o.name)}" data-in="outfitName"></label>
        <div class="ctl"><span class="lbl">Layers, inside to outside</span><div class="list">${order.map((it,i)=>`<div class="li"><span class="num faint">${i+1}</span><div class="thumb">${flatSVG(it.spec,'front')}</div><div class="grow"><b>${esc(it.g.name)}</b><small>Size ${it.fit.size} · ${it.fit.verdict==='good'?'good fit':it.fit.verdict==='check'?'check fit':'tight'}</small></div><button class="btn sm ghost" data-a="${id==='draft'?'outfitRemove':'outfitItemRemove'}" data-id="${it.g.id}" data-o="${o.id}">Remove</button></div>`).join('')}</div></div>
        ${missing?`<div class="note warn">${missing} piece${missing>1?'s were':' was'} removed from the library and can’t be shown.</div>`:''}
        <p class="faint" style="font-size:12.5px">Layers are ordered automatically (trousers, then tops, then jackets, then robes). Each outer layer is sized to sit outside the one beneath it, which prevents basic intersections.</p>
        <div class="row">${id==='draft' ? `<button class="btn primary" data-a="outfitSave">Save outfit</button><button class="btn" data-a="go" data-r="wardrobe">Add more pieces</button>` : `<button class="btn danger" data-a="outfitDelete" data-id="${o.id}">Delete outfit</button>`}</div>
      </section>
    </div>
  </div>`;
}

/* ---------- WORKSHOP ---------- */
function workshopSource(){
  const w = S.workshop;
  if (!w.src){ const d = designs()[0]; if (d) w.src = {type:'design', id:d.id}; else { const g = garmentsPub()[0]; if (g) w.src = {type:'garment', id:g.id}; } }
  if (!w.src) return null;
  if (w.src.type==='design'){ const d = Store.private.designs[w.src.id]; if (!d){ w.src=null; return workshopSource(); } return {label:d.name, spec:d.spec, design:d, profileId:d.profileId}; }
  if (w.src.type==='shared'){ return w.src.data; }
  const g = getGarment(w.src.id); if (!g){ w.src=null; return null; }
  return {label:g.name, spec:g.spec, garment:g};
}
function viewWorkshop(){
  S.vcfg = null;
  const w = S.workshop; const src = workshopSource();
  if (!src) return `<div class="page-head"><div><h1>Tailoring Workshop</h1></div></div><div class="empty"><h3>Nothing to work on yet</h3><p>Create a design or add garments to the library first.</p><button class="btn" data-a="go" data-r="create">Create a design</button></div>`;
  const prof = (src.profile) || (w.profileId==='ref-none' ? REF_PROFILE : (Store.private.profiles[w.profileId] || Store.private.profiles[src.profileId] || activeProfile() || REF_PROFILE));
  const spec = src.spec;
  const fab = FABRICS[spec.fabric]||FABRICS.poplin;
  const prices = src.design?.prices || w.prices;
  let mat;
  try { mat = calcMaterials(prof, spec, {width:w.width||fab.w, sa:w.sa, ha:w.ha, waste:w.waste, repeat:w.repeat, prices}); }
  catch(e){ console.error(e); return `<div class="note warn">This garment could not be drafted: ${esc(e.message)}</div>`; }
  S.lastMat = {mat, prof, spec, src};
  const tabs = [['materials','Materials'],['pattern','Pattern'],['layout','Cutting layout'],['steps','Sewing steps'],['sheet','Technical sheet']];
  const opts = [...designs().map(d=>`<option value="design:${d.id}" ${w.src.type==='design'&&w.src.id===d.id?'selected':''}>Design · ${esc(d.name)}</option>`), ...garmentsPub().map(g=>`<option value="garment:${g.id}" ${w.src.type==='garment'&&w.src.id===g.id?'selected':''}>Library · ${esc(g.name)}</option>`)];
  if (w.src.type==='shared') opts.unshift(`<option selected>Client project · ${esc(src.label)}</option>`);
  const body = {materials:wsMaterials, pattern:wsPattern, layout:wsLayout, steps:wsSteps, sheet:wsSheet}[w.tab](mat, prof, spec, src);
  return `
  <div class="page-head">
    <div><h1>Tailoring Workshop</h1><p>Materials, pattern pieces, cutting layout and sewing steps, drafted from one design and one body.</p></div>
    <button class="btn sm ${S.settings.technical?'primary':''}" data-a="toggleTechnical" aria-pressed="${S.settings.technical}">Technical mode: ${S.settings.technical?'on':'off'}</button>
  </div>
  <div class="panel" style="margin-bottom:16px"><div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
    <label class="field">Working on<select id="ws-src" data-ch="wsSrc">${opts.join('')}</select></label>
    <label class="field">For body profile<select id="ws-prof" data-ch="wsProf" ${src.profile?'disabled':''}>${src.profile?`<option>${esc(src.profile.name)}</option>`:''}${profiles().map(p=>`<option value="${p.id}" ${p.id===prof.id?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="ref" ${prof.ref?'selected':''}>Reference body (size M)</option></select></label>
    <div class="field"><span>Status</span><div class="row tight" style="min-height:40px"><span class="chip warn">Draft pattern</span>${mat.missing.length?'<span class="chip bad">Estimated measurements</span>':''}${prof.verified?'<span class="chip ok">Verified body</span>':'<span class="chip">Unverified body</span>'}</div></div>
  </div>
  ${src.garment ? '<p class="faint" style="font-size:12.5px;margin-top:10px">Library garments are drafted made-to-measure in the garment’s style for this body, not from its size chart.</p>':''}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${w.tab===k}" data-a="wsTab" data-t="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}
function wsMaterials(mat, prof, spec, src){
  const w = S.workshop; const cur = S.settings.currency;
  const prices = src.design?.prices || w.prices;
  const tech = S.settings.technical;
  return `<div class="two" style="align-items:start">
    <section class="panel stack">
      <h2>Inputs</h2>
      <div class="form-grid">
        <label class="field">Fabric width<span class="inwrap" style="display:flex;gap:6px;align-items:center"><input type="number" id="ws-width" data-ch="wsNum" data-k="width" value="${Units.val(mat.width)}" step="1"><span class="faint mono">${Units.sys}</span></span><small>${esc(FABRICS[spec.fabric]?.name||'')}</small></label>
        <label class="field">Main fabric price / ${Units.sys==='in'?'yd':'m'}<input type="number" id="ws-pmain" data-ch="wsPrice" data-k="main" value="${prices?.main ?? ''}" placeholder="Your price"></label>
        ${mat.rows.some(r=>r.k==='lining')?`<label class="field">Lining price / ${Units.sys==='in'?'yd':'m'}<input type="number" id="ws-plin" data-ch="wsPrice" data-k="lining" value="${prices?.lining ?? ''}" placeholder="Your price"></label>`:''}
        ${mat.rows.some(r=>r.k==='interfacing')?`<label class="field">Interfacing price / ${Units.sys==='in'?'yd':'m'}<input type="number" id="ws-pint" data-ch="wsPrice" data-k="interfacing" value="${prices?.interfacing ?? ''}" placeholder="Your price"></label>`:''}
        <label class="field">Currency<select id="ws-cur" data-ch="setCurrency">${Object.keys(CURRENCIES).map(c=>`<option ${cur===c?'selected':''}>${c}</option>`).join('')}</select></label>
      </div>
      ${tech ? `<div class="form-grid">
        <label class="field">Seam allowance<input type="number" step="0.1" id="ws-sa" data-ch="wsNum" data-k="sa" value="${Units.val(mat.sa)}"></label>
        <label class="field">Hem allowance<input type="number" step="0.1" id="ws-ha" data-ch="wsNum" data-k="ha" value="${Units.val(mat.ha)}"></label>
        <label class="field">Cutting waste %<input type="number" step="1" id="ws-waste" data-ch="wsPct" data-k="waste" value="${Math.round((w.waste??.05)*100)}"></label>
        <label class="field">Print repeat<input type="number" step="0.5" id="ws-rep" data-ch="wsNum" data-k="repeat" value="${Units.val(mat.repeat)}"></label>
      </div>` : '<p class="faint" style="font-size:12.5px">Seam and hem allowances, waste and print repeat can be changed in technical mode.</p>'}
      ${prices===src.design?.prices && src.design?.sample && prices?.main ? '<span class="chip demo">Example prices</span>':''}
    </section>
    <section class="panel stack">
      <div class="spread"><h2>Estimate</h2><span class="chip ${mat.confidence==='Low'?'bad':'warn'}">Confidence: ${mat.confidence}</span></div>
      <div class="qty-grid">

/* ---------- garment editor (tailor) ---------- */

  const zoneKeys = [...new Set(sizeKeys.flatMap(s=>Object.keys(sizes[s])))];
  const it = sizeKeys.length ? (()=>{ const fit = computeFit(p, spec, sizes, ge.previewSize); return {spec, circ:fit.circ, zones:fit.zones}; })() : fitItemForSpec(p, spec);

  const t = spec.template;
  const pipe = ge.pipeline;
  return `
  <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-a="tailorTabGo" data-t="library">${ic('back')}Garment library</button></div>
  <div class="page-head"><div><span class="eyebrow">${ge.isNew?'New garment':'Editing · version '+g.version}</span><h1>${esc(g.name||'Untitled garment')}</h1></div>

    <div class="side">
      ${pipe ? `<section class="panel stack s"><h2>Processing</h2><ul class="pipeline">${pipe.map(s=>`<li class="${s.state}"><i>${s.state==='ok'?'✓':s.state==='warn'?'!':s.state==='bad'?'×':s.state==='run'?'':'·'}</i><span><b>${esc(s.label)}</b>${s.detail?`<br><span class="faint">${esc(s.detail)}</span>`:''}</span></li>`).join('')}</ul></section>`:''}
      <section class="panel stack">
        <label class="field">Name<input type="text" id="ge-name" data-in="ged" data-k="name" value="${esc(g.name)}"></label>
        <label class="field">Category<select id="ge-cat" data-ch="gedCat">${CATEGORIES.map(c=>`<option value="${c.k}" ${g.category===c.k?'selected':''}>${c.label}</option>`).join('')}</select></label>
        <label class="field">Description<textarea id="ge-desc" data-in="ged" data-k="description">${esc(g.description)}</textarea></label>
        <div class="form-grid">
          <label class="field">Tailor / designer<input type="text" id="ge-des" data-in="ged" data-k="designer" value="${esc(g.designer||'')}"></label>

          <label class="field">Tags<input type="text" id="ge-tags" data-in="gedTags" value="${esc((g.tags||[]).join(', '))}" placeholder="comma separated"></label>
        </div>
      </section>
      <section class="panel stack">
        <h3>Shape</h3>
        ${optRow('fit', OPTIONS.fit.filter(x=>x!=='custom'), spec.fit, 'Fit').replace(/data-a="spec"/g,'data-a="gspec"')}
        ${optRow('length', LENGTHS_FOR[t]||OPTIONS.length, spec.length, 'Length').replace(/data-a="spec"/g,'data-a="gspec"')}
        ${!['bottom','skirt'].includes(t) ? optRow('sleeve', OPTIONS.sleeve, spec.sleeve, 'Sleeves').replace(/data-a="spec"/g,'data-a="gspec"') + optRow('collar', COLLARS_FOR[t]||OPTIONS.collar, spec.collar, 'Collar').replace(/data-a="spec"/g,'data-a="gspec"') + optRow('closure', OPTIONS.closure, spec.closure, 'Closure').replace(/data-a="spec"/g,'data-a="gspec"') : ''}

        <label class="field">Fabric<select id="ge-fab" data-ch="gedFabric">${Object.entries(FABRICS).map(([k,v])=>`<option value="${k}" ${spec.fabric===k?'selected':''}>${v.name}</option>`).join('')}</select></label>
        ${optRow('print', OPTIONS.print, spec.print, 'Print').replace(/data-a="spec"/g,'data-a="gspec"')}
      </section>
      <section class="panel stack">
        <h3>Colour options</h3>

      <section class="panel stack">
        <h3>Photos and assets</h3>
        <div class="refs">${(g.images||[]).map((im,i)=>`<div class="ref"><img src="${im.data}" alt="${esc(im.view)} photo"><button data-a="gedImgRemove" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('')}</div>
        ${(g.images||[]).length<3?`<label class="drop">Add front, back or side photo (JPEG/PNG, resized to 480 px)<input type="file" accept="image/jpeg,image/png,image/webp" class="visually-hidden" data-ch="gedImg"></label>`:''}
        <label class="drop">Attach 3D garment (.glb / .gltf)<input type="file" accept=".glb,.gltf,model/gltf-binary" class="visually-hidden" data-ch="gedAsset"></label>
        ${g.asset ? `<p class="note">${esc(g.asset.note)}</p>`:''}

      ${!ge.isNew ? `<section class="panel stack s"><h3>Version history</h3>${(g.history||[]).length?`<div class="list">${g.history.slice().reverse().map(h=>`<div class="li"><div class="grow"><b>Version ${h.version}</b><small>${fmtDate(h.at)} · ${esc(h.name)}</small></div></div>`).join('')}</div>`:'<p class="faint" style="font-size:13px">No earlier versions.</p>'}<p class="faint" style="font-size:12.5px">Saving a published garment creates a new version. Customers’ saved designs keep their own copy, and only fit results for this garment are recalculated.</p>
        <div class="row"><button class="btn sm danger" data-a="gedDelete">Delete garment</button></div></section>`:''}
    </div>
  </div>`;
}

/* ================= APP CONTROLLER ================= */
const VIEWS = {home:viewHome, body:viewBody, create:viewCreate, wardrobe:viewWardrobe, garment:viewGarment, outfit:viewOutfit, workshop:viewWorkshop,
  designs:viewDesigns, projects:viewProjects, tailor:viewTailor, garmentEdit:viewGarmentEdit, notifications:viewNotifications, settings:viewSettings};

const App = {
  pendingRender:false,
  render(){
    if (!Store.ready) return;
    renderNav();
    const main = $('#main');
    let html;
    try { html = (VIEWS[S.route] || viewHome)(); }
    catch(e){ console.error(e); html = `<div class="note warn"><b>Something went wrong showing this page.</b> ${esc(e.message)}<br><button class="btn sm" data-a="go" data-r="home" style="margin-top:8px">Go to the homepage</button></div>`; S.vcfg=null; }
    main.innerHTML = html;
    const host = main.querySelector('[data-stage]');
    if (host && S.vcfg){ Viewer.attach(host); Viewer.setConfig(S.vcfg); }
    else Viewer.attach(null);
    this.pendingRender = false;
  },
  refreshViewer(){
    try { (VIEWS[S.route]||viewHome)(); } catch(e){ return; }
    if (S.vcfg && Viewer.ok) Viewer.setConfig(S.vcfg);
  },
  softRender(){
    const a = document.activeElement;
    if (a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ this.pendingRender = true; return; }
    this.render();
  },
  go(route, params={}){
    if (S.route==='wardrobe' && route!=='wardrobe' && route!=='garment'){ S.settings.lastSeenGarmentsAt = nowIso(); Store.putSettings(); }
    if (S.route==='body' && route!=='body') S.bodyEdit = null;
    S.route = route; S.params = params;
    this.closeModal();
    this.render();
    window.scrollTo(0,0);
    $('#main').focus({preventScroll:true});
  },
  updateBadges(){ if (Store.ready) renderNav(); },
  modal(html){ $('#overlay').innerHTML = `<div class="scrim" data-a="scrim">${html}</div>`; const f = $('#overlay').querySelector('input,button,select,textarea'); if (f) f.focus(); },
  closeModal(){ $('#overlay').innerHTML = ''; },
  confirm(title, body, label, fn, danger=true){
    App._confirmFn = fn;
    this.modal(`<div class="modal" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p class="muted">${body}</p><div class="row"><button class="btn ${danger?'danger':'primary'}" data-a="confirmYes">${esc(label)}</button><button class="btn ghost" data-a="closeModal">Cancel</button></div></div>`);
  },
  onRemote(kind, info){
    if (kind==='garments'){
      const fresh = (info||[]).filter(ch => ch.type==='added').map(ch => ch.doc.data && ch.doc.data()).filter(g => g && g.status==='published' && g.createdBy!==Store.uid);
      if (fresh.length > 2){ notify('garment', `${fresh.length} new garments in the library`, 'They fit your saved avatar with no new scan.', {r:'wardrobe'}); toast(`${fresh.length} new garments in the library`); }
      else for (const g of fresh){ notify('garment', `New in the library: ${g.name}`, `${CAT[g.category]?.label||''} by ${g.designer||'a tailor'}`, {r:'garment', id:g.id}); toast(`New garment: ${g.name}`); }
      for (const ch of (info||[])){
        if (ch.type==='modified' || ch.type==='removed'){ for (const k of [...S.fitCache.keys()]) if (k.includes(':'+(ch.doc.id)+':')) S.fitCache.delete(k); }
      }
      if (['wardrobe','garment','studio','home','tailor','outfit'].includes(S.route)) this.softRender(); else this.updateBadges();
    }

/* ---------- helpers ---------- */
function pushUndo(){ S.undo.push(JSON.stringify(S.studio.spec)); if (S.undo.length>60) S.undo.shift(); S.redo = []; }
function setSpec(k, v){
  const sp = S.studio.spec;
  if (sp[k]===v) return;
  pushUndo();
  sp[k] = v;
  if (k==='fabric' && v!=='izelia') sp.fabricProduct = null;
  if (k==='closure' && v==='double-breasted' && (sp.buttons%2 || sp.buttons<2)) sp.buttons = 6;
  if (k==='closure' && v==='buttons' && !sp.buttons) sp.buttons = 5;
  if (k==='sleeve' && v!=='long' && ['barrel','french','ribbed'].includes(sp.cuffs)) sp.cuffs = 'none';
  App.render();
}
function validMeasure(k, v){
  if (v==null) return true;
  const r = k==='height' ? [60,240] : k==='weight' ? [3,300] : ['inseam','outseam','armLength'].includes(k) ? [10,150] : [5,220];
  return v>=r[0] && v<=r[1];
}
async function downscale(file, max=480, q=.72){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
function slug(s){ return String(s||'design').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'design'; }
function currentDesignFromStudio(){ return S.studio?.designId ? Store.private.designs[S.studio.designId] : null; }

/* ---------- garment processing pipeline (tailor publish) ---------- */
async function runPipeline(target){
  const ge = S.gedit, g = ge.g;
  const steps = [
    {label:'Validate files', run(){ const bad = (g.images||[]).filter(i=>!/^data:image\/(jpeg|png|webp)/.test(i.data)); if (bad.length) return ['bad', 'Unsupported image data']; return ['ok', `${(g.images||[]).length} photo${(g.images||[]).length===1?'':'s'}${g.asset?', 1 3D file checked (not hosted)':''}${g.patternFile?', 1 pattern file noted':''}`]; }},
    {label:'Identify category', run(){ if (!g.name.trim()) return ['bad','Add a garment name']; if (!CAT[g.category]){ const guess = localInterpret(g.name+' '+g.description).fields.category; if (guess){ g.category = guess; return ['warn', `Guessed “${CAT[guess].label}” from the name`]; } return ['bad','Choose a category']; } return ['ok', `${CAT[g.category].label} → ${TEMPLATE_LABEL[g.spec.template]}`]; }},
    {label:'Extract metadata', run(){ if (!(g.tags||[]).length){ const words = (g.description||'').toLowerCase().match(/\b(linen|denim|silk|wool|ankara|gara|damask|formal|summer|casual|evening|office|traditional)\b/g)||[]; g.tags = [...new Set(words)].slice(0,5); } return [g.description.trim()?'ok':'warn', g.description.trim()? `Tags: ${(g.tags||[]).join(', ')||'none'}` : 'No description; customers see an empty text block']; }},
    {label:'Associate measurements and materials', run(){ const need = {top:['chest','waist'], tee:['chest'], hoodie:['chest'], jacket:['chest','waist'], dress:['chest','waist','hip'], robe:['chest'], bottom:['waist','hip'], skirt:['waist','hip'], suit:['chest','waist','hip']}[g.spec.template]||['chest']; const sizes = Object.keys(g.sizes||{}); const miss = sizes.length ? sizes.flatMap(s=>need.filter(z=>!(g.sizes[s][z]>0)).map(z=>`${s} ${z}`)) : ['size chart']; g._missingChart = miss; return miss.length ? ['warn', `Missing ${miss.slice(0,4).join(', ')}${miss.length>4?'…':''}`] : ['ok', `${sizes.length} sizes, ${FABRICS[g.spec.fabric]?.name}`]; }},
    {label:'Prepare 3D representation', run(){ return g.asset ? ['warn', `Uploaded 3D file validated but not hosted (no asset storage). Using the parametric ${TEMPLATE_LABEL[g.spec.template].toLowerCase()}.`] : ['ok', `Parametric ${TEMPLATE_LABEL[g.spec.template].toLowerCase()} generated from the spec`]; }},
    {label:'Check avatar compatibility', run(){ try { for (const s of Object.keys(g.sizes||{})){ const f = computeFit(REF_PROFILE, g.spec, g.sizes, s); if (f.zones.some(z=>z.garment!=null && (isNaN(z.garment) || z.garment<20))) return ['bad', `Size ${s} has implausible values`]; } return ['ok','Fits the parametric avatar system']; } catch(e){ return ['bad', e.message]; } }},
    {label:'Flag missing data', run(){ const m = []; if (!(g.colors||[]).length) m.push('colour options'); if (g.price==null) m.push('price'); if (!(g.images||[]).length) m.push('photos (flat sketch used)'); if ((g._missingChart||[]).length) m.push('size chart values'); g.processing = {ok:true, missing:m.filter(x=>x!=='price' && !x.startsWith('photos')), at:nowIso()}; return [m.length?'warn':'ok', m.length? 'Missing: '+m.join(', ') : 'Nothing missing']; }},
    {label:'Set fitting modes', run(){ g.fitModes = ['preview']; if (!(g._missingChart||[]).length) g.fitModes.push('estimated'); return ['ok', g.fitModes.includes('estimated') ? 'Preview and estimated fit' : 'Preview only (size chart incomplete)']; }},
    {label: target==='published' ? 'Publish to library' : 'Save draft', run(){ return ['ok', target==='published' ? 'Visible to every customer without a redeploy' : 'Only tailors can see drafts']; }},
  ];
  ge.pipeline = steps.map(s=>({label:s.label, state:'', detail:''}));
  App.render();
  let blocked = false;
  for (let i=0;i<steps.length;i++){
    if (blocked){ ge.pipeline[i].state = ''; ge.pipeline[i].detail = 'Skipped'; continue; }
    ge.pipeline[i].state = 'run'; App.softRender();
    await sleep(220);
    const [state, detail] = steps[i].run();
    ge.pipeline[i].state = state; ge.pipeline[i].detail = detail;
    if (state==='bad') blocked = true;
  }
  delete g._missingChart;
  App.softRender();
  return !blocked;
}

    const orig = getGarment(g.id);
    if (orig && orig.status==='published' && target==='published' && JSON.stringify({...orig, updatedAt:0, processing:0, fitModes:0}) !== JSON.stringify({...g, updatedAt:0, processing:0, fitModes:0})){
      g.history = [...(orig.history||[]), {version:orig.version, at:orig.updatedAt, name:orig.name}].slice(-20);
      g.version = (orig.version||1) + 1;
    }
    g.status = target==='published' ? 'published' : (orig?.status==='published' ? 'published' : 'draft');
    if (target==='draft' && orig?.status==='published'){ g.status = 'draft'; }
    g.template = g.spec.template;
    if (ge.isNew || !orig?.createdAt) g.createdAt = nowIso();
    const saved = await Store.putGarment(clone(g));
    if (saved===false) return;
    for (const k of [...S.fitCache.keys()]) if (k.includes(':'+g.id+':')) S.fitCache.delete(k);
    ge.isNew = false;
    notify('processing', `${g.name}: ${target==='published'?'published':'saved as draft'}`, (g.processing?.missing||[]).length ? 'Missing: '+g.processing.missing.join(', ') : 'Processing complete', {r:'garment', id:g.id});

/* ---------- events ---------- */
function bindEvents(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const fn = ACT[el.dataset.a]; if (!fn) return;
    if (el.tagName==='A') e.preventDefault();
    if (el.dataset.a==='mfocus') { fn(el, e); return; }
    try { const r = fn(el, e); if (r && r.catch) r.catch(err=>{ console.error(err); toast('Something went wrong: '+(err.message||err), true); }); }
    catch(err){ console.error(err); toast('Something went wrong: '+err.message, true); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key==='Enter' || e.key===' ') && e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.click(); }
    if (e.key==='Escape'){ const full = $('.stage.full'); if (full){ full.classList.remove('full'); Viewer.resize(); } else if ($('#overlay').innerHTML) ACT.closeModal(); }
    if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z' && S.route==='create' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); e.shiftKey ? ACT.redo() : ACT.undo(); }
  });
  document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.in && (el.type==='range' || el.type==='color') && S.studio && S.studio._pre){ S.undo.push(S.studio._pre); S.redo = []; S.studio._pre = null; App.render(); return; }
    const c = el.closest('[data-ch]'); if (c && CH[c.dataset.ch]) { const r = CH[c.dataset.ch](c, e); if (r && r.catch) r.catch(err=>{ console.error(err); toast('Something went wrong: '+err.message, true); }); }
  });
  document.addEventListener('focusin', e => { const el = e.target; if (el.matches && el.matches('input[data-in="meas"]')) ACT.mfocus({dataset:{k:el.dataset.k}}); });
  document.addEventListener('focusout', () => { setTimeout(()=>{ if (App.pendingRender && !( $('#main').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) App.render(); }, 50); });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ Viewer.dirty = true; });
}
function applyTheme(){ const t = S.settings?.theme || 'system'; if (t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

async function boot(){
  $('#root').innerHTML = shellHTML();
  $('#main').innerHTML = `<div class="loading"><div class="spinner"></div><span>Opening your atelier…</span></div>`;
  bindEvents();
  await Store.init();
  S.settings = Object.assign(defaultSettings(), Store.settings || {});
  S.settings.notif = Object.assign(defaultSettings().notif, S.settings.notif||{});
  Store.settings = S.settings;
  S.demoRole = S.settings.demoRole || 'customer';
  applyTheme();
  // new garments since the last visit
  const nw = S.settings.lastSeenGarmentsAt ? newGarments() : [];
  if (nw.length && !(S.settings.notifications||[]).some(n => n.title.startsWith(`${nw.length} new garment`) && n.at > S.settings.lastSeenGarmentsAt)) notify('garment', `${nw.length} new garment${nw.length>1?'s':''} in the library`, 'They fit your saved avatar with no new scan.', {r:'wardrobe'});
  if (!Store.settings.onboarded && !Object.keys(Store.private.profiles).length){ /* first visit: home shows onboarding */ }
  applyBrand();
  const rh = routeFromHash(); if (rh){ S.route = rh[0]; S.params = rh[1]; }
  App.render();
  const lc = document.getElementById('launch');
  if (lc){
    const bg = lc.querySelector('.lbg'); if (bg) bg.style.backgroundImage = `url(${MOCK_IMG.launch})`;
    const close = r => { lc.style.opacity='0'; setTimeout(()=>lc.remove(), 500); if (r) App.go(r); };
    let seen = false; try { seen = !!localStorage.getItem('izelia:splash'); } catch(e){}
    if (seen) setTimeout(()=>close(), 700);
    else {
      const b = lc.querySelector('.lbtns'), bar = lc.querySelector('i'); if (b) b.hidden = false; if (bar) bar.remove();
      const done = r => { try { localStorage.setItem('izelia:splash','1'); } catch(e){} close(r); };
      lc.querySelector('#l-start')?.addEventListener('click', ()=>done('home'));
      lc.querySelector('#l-acct')?.addEventListener('click', ()=>done('account'));
    }
  }
  Caps.init();
  if (Store.canPublish()) App.loadNames();
}

function setHash(){
  const r = S.route; let h = r;
  if (r==='shop') h = S.params.c && S.params.c!=='all' ? S.params.c : 'shop';
  else if (r==='policy') h = S.params.p || 'delivery';
  else if (['product','garment','outfit','order','garmentEdit'].includes(r)) h = r==='product' ? 'p'+(S.params.id||'').replace(/^p/,'') : '';
  try { if (h && ('#'+h)!==location.hash) history.replaceState(null, '', '#'+h); } catch{}
}
function routeFromHash(){
  const h = (location.hash||'').replace('#','');
  if (!h) return null;
  if (COLLECTIONS[h]) return ['shop', {c:h}];
  if (h==='shop' || h==='new') return ['shop', {c:h==='new'?'new':'all'}];
  if (['delivery','returns','terms','privacy','faq'].includes(h)) return ['policy', {p:h}];
  if (/^p\d+$/.test(h) && Store.products['p'+h.slice(1)]) return ['product', {id:'p'+h.slice(1)}];
  if (VIEWS[h] && !['product','garment','outfit','order','garmentEdit'].includes(h)) return [h, {}];
  return null;
}

document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const val = id => ($('#'+id)?.value || '').trim();
  const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  if (kind==='newsletter'){
    const em = val('nl-email');
    if (!emailOk(em)){ toast('Enter a valid email address.', true); return; }
    if (!$('#nl-consent').checked){ toast('Tick the box to agree to receive emails.', true); return; }
    Store.myInbox.newsletter = {email:em, at:nowIso(), consent:true};
    Store.shop.prefs = Object.assign({}, Store.shop.prefs, {newsletter:true}); Store.putShop();
    if (await Store.putInbox()!==false){ toast(Store.mode==='cloud' ? 'Subscribed. IZELIA staff can now see your sign-up.' : 'Saved on this device (preview).'); $('#nl-email').value=''; }
  }
  if (kind==='contact'){
    const m = {name:val('ct-name'), email:val('ct-email'), topic:val('ct-topic'), subject:val('ct-subject'), text:val('ct-msg'), at:nowIso()};
    if (!m.name || !m.subject || !m.text){ toast('Fill in your name, a subject and a message.', true); return; }
    if (!emailOk(m.email)){ toast('Enter a valid email address so IZELIA can reply.', true); return; }
    Store.myInbox.messages = [...(Store.myInbox.messages||[]), m].slice(-20);
    if (await Store.putInbox()!==false){ S.contactSent = true; App.render(); }
  }
  if (kind==='checkout'){
    const co = S.co, lines = bagLines();
    const del = Store.content.delivery.find(d=>d.id===co.delivery && d.enabled);
    const missing = [];
    if (!co.name.trim()) missing.push('name'); if (!emailOk(co.email.trim())) missing.push('a valid email');
    if (!del) missing.push('a delivery method');
    if (co.delivery!=='collect'){ if (!co.line1.trim()) missing.push('address line 1'); if (!co.city.trim()) missing.push('town or city'); if (!co.country.trim()) missing.push('country'); }
    if (missing.length){ toast('Add '+missing.join(', ')+'.', true); return; }
    for (const l of lines){ const st = stockOf(l.p); if (!st.ok || (st.qty!=null && l.qty>st.qty)){ toast(`${l.p.name} is no longer available in that quantity.`, true); return; } }
    const sub = bagSubtotal(), id = uid('o');
    const ref = 'IZ-' + Date.now().toString(36).toUpperCase().slice(-6);
    const order = {id, ref, createdAt:nowIso(), updatedAt:nowIso(), items:lines.map(l=>({pid:l.p.id, name:l.p.name, size:l.size, qty:l.qty, price:l.p.price})), subtotal:sub,
      delivery:{id:del.id, label:del.label, price:del.price||0, eta:del.eta}, total:sub+(del.price||0), currency:'GBP',
      contact:{name:co.name.trim(), email:co.email.trim(), phone:co.phone.trim()}, address: co.delivery==='collect' ? null : {name:co.name, line1:co.line1, line2:co.line2, city:co.city, region:co.region, postcode:co.postcode, country:co.country},
      notes:co.notes||'', payment:'Not paid (test checkout)', fulfilment:'New', deliveryStatus:'Not dispatched', test:true};
    if (await Store.putOrder(order)===false) return;
    // stock decrement for tracked products (staff only can write products; customers' orders are reconciled by staff)
    if (Store.canPublish()) for (const l of lines){ if (l.p.stock?.tracked){ const p = clone(l.p); p.stock.qty = Math.max(0, (p.stock.qty||0) - l.qty); await Store.putProduct(p); } }
    if (order.address && $('#co-save')?.checked && !Store.shop.addresses.some(a=>a.line1===order.address.line1 && a.city===order.address.city)) Store.shop.addresses.unshift(order.address);
    Store.shop.bag = []; Store.putShop(); S.co = null;
    notify('tailor', `Order ${ref} recorded`, 'Test checkout: no payment taken', {r:'account'});
    App.go('order', {id});
  }
});

/* ---------- imagery ----------
   Order of preference: images the admin uploaded → IZELIA's own photos (izelia.co.uk, in the
   standalone site and app) → imported product photos → campaign images from the owner's mockup. */
const firstPhoto = list => { for (const p of list){ const u = photoOf(p); if (u) return u; } return null; };
const MOCK_HERO = {all:'shop', clothing:'shop', womenswear:'shop', menswear:'t_new', royalty:'banner', accessories:'acc', fabrics:'t_fab', new:'banner'};
const MOCK_TILE = {clothing:'t_cloth', accessories:'t_acc', fabrics:'t_fab', new:'t_new'};
function collImage(k, slot='tile'){
  const c = Store.content || {};
  if (c.tileImages?.[k]) return c.tileImages[k];
  const fb = MOCK_IMG[(slot==='tile' && MOCK_TILE[k]) || MOCK_HERO[k] || 'shop'];
  if (remoteOn() && REMOTE_TILES[k]) return `url(${IZ_UPLOADS + REMOTE_TILES[k]}),url(${fb})`; // the mockup image shows if izelia.co.uk can't be reached
  const ps = productsPub();
  const own0 = k==='clothing' ? firstPhoto(ps.filter(p=>p.type==='garment')) : k==='new' ? firstPhoto(ps.slice(0, 12)) : k==='all' ? (firstPhoto(ps.filter(p=>p.featured)) || firstPhoto(ps)) : firstPhoto(ps.filter(p=>inCollection(p, k)));
  if (own0) return own0.startsWith('http') ? `url(${own0}),url(${fb})` : own0;
  return fb;
}

function socialIcon(k){

/* ---------- SHOP / COLLECTIONS / ACCESSORIES / FABRICS ---------- */
function shopState(){ return S.shopF || (S.shopF = {sub:'', q:'', min:'', max:'', size:'', avail:false, sort:'featured', cols:3, page:1, filters:false}); }
function viewShop(){
  S.vcfg = null;
  const c = S.params.c || 'all', f = shopState();
  let list = productsPub();
  if (c==='new') list = list.slice(0, 16);
  else if (c==='clothing') list = list.filter(p=>p.type==='garment');
  else list = list.filter(p=>inCollection(p, c));
  const subs = [...new Set(list.map(p=>p.subtype))];
  const sizes = [...new Set(list.flatMap(p=>p.sizes))];
  if (f.sub && subs.includes(f.sub)) list = list.filter(p=>p.subtype===f.sub);
  const q = f.q.trim().toLowerCase(); if (q) list = list.filter(p=>(p.name+' '+p.subtype+' '+p.collections.join(' ')).toLowerCase().includes(q));
  if (f.min!=='') list = list.filter(p=>p.price >= +f.min);
  if (f.max!=='') list = list.filter(p=>p.price <= +f.max);
  if (f.size) list = list.filter(p=>p.sizes.includes(f.size));
  if (f.avail) list = list.filter(p=>stockOf(p).ok);
  const sorts = {featured:(a,b)=>(b.featured-a.featured)||((b.createdAt||'').localeCompare(a.createdAt||'')), newest:(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''), asc:(a,b)=>a.price-b.price, desc:(a,b)=>b.price-a.price, az:(a,b)=>a.name.localeCompare(b.name)};
  list.sort(sorts[f.sort]||sorts.newest);
  const meta = COLL_META[c] || COLL_META.all;
  const active = !!(f.q || f.sub || f.min!=='' || f.max!=='' || f.size || f.avail);
  const fabric = c==='fabrics' || c==='royalty';
  const per = fabric ? 16 : 12, pages = Math.max(1, Math.ceil(list.length/per)); f.page = clamp(f.page||1, 1, pages);
  const shown = list.slice((f.page-1)*per, f.page*per);
  const pills = ['all','womenswear','menswear','new'].includes(c) || c==='clothing'
    ? SHOP_PILLS.map(([k,l])=>`<button data-a="shopColl" data-v="${k}" aria-pressed="${c===k}">${l}</button>`).join('')
    : `<button data-a="shopSub" data-v="" aria-pressed="${!f.sub}">All</button>${subs.map(s=>`<button data-a="shopSub" data-v="${esc(s)}" aria-pressed="${f.sub===s}">${esc(s)}</button>`).join('')}`;
  const subRow = (['all','womenswear','menswear','new','clothing'].includes(c) && subs.length>1) ? `<div class="zpills sm">${`<button data-a="shopSub" data-v="" aria-pressed="${!f.sub}">All types</button>`+subs.map(s=>`<button data-a="shopSub" data-v="${esc(s)}" aria-pressed="${f.sub===s}">${esc(s)}</button>`).join('')}</div>` : '';
  return `
  ${zhero({kicker: c==='royalty'?'IZELIA · Royalty':'IZELIA', title:meta.title, sub:meta.sub, img:collImage(c,'hero'), cta: c==='fabrics'?'Shop fabrics':'', ctaAttrs:'data-a="scrollTo" data-v="zgrid"', label:meta.title})}
  <div class="wrap">
    <div class="zbar">
      <div class="zpills" role="group" aria-label="Browse">${pills}</div>
      <div class="zbar-r">
        <label class="zsearch"><span class="visually-hidden">Search this page</span>${ic('search')}<input type="search" id="sf-q" data-in="shopQ" value="${esc(f.q)}" placeholder="${fabric?'Search fabrics…':'Search styles…'}"></label>
        <label class="zsort"><span>Sort by:</span><select id="sf-sort" data-ch="shopF" data-k="sort">${[['newest','Newest'],['featured','Featured'],['asc','Price: low to high'],['desc','Price: high to low'],['az','A–Z']].map(([k,l])=>`<option value="${k}" ${f.sort===k?'selected':''}>${l}</option>`).join('')}</select></label>
        <button class="btn sm line" data-a="shopFilters" aria-expanded="${!!f.filters}">Filters</button>
      </div>
    </div>
    ${subRow}
    ${f.filters ? `<div class="filters zfilters">
      <label class="field">Min £<input type="number" id="sf-min" min="0" data-ch="shopF" data-k="min" value="${esc(f.min)}"></label>
      <label class="field">Max £<input type="number" id="sf-max" min="0" data-ch="shopF" data-k="max" value="${esc(f.max)}"></label>
      ${sizes.length?`<label class="field">Size<select id="sf-size" data-ch="shopF" data-k="size"><option value="">Any</option>${sizes.map(s=>`<option ${f.size===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`:''}
      <label class="check" style="flex:0 0 auto;padding-bottom:10px"><input type="checkbox" id="sf-avail" data-ch="shopAvail" ${f.avail?'checked':''}><span>Available now</span></label>
      <button class="zlink" data-a="shopClear" data-k="all">Reset</button></div>` : ''}
    ${fabric ? `<h2 class="zlabel" style="margin:6px 0 16px">${c==='fabrics'?'Popular fabrics':'The collection'} <span class="faint" style="letter-spacing:0;text-transform:none;font-weight:400">· ${list.length}</span>${active?' <button class="zlink" data-a="shopClear" data-k="all" style="font-family:var(--f-body);text-transform:none;letter-spacing:0">Clear filters</button>':''}</h2>` : `<p class="faint" style="font-size:13px;margin-bottom:14px">${list.length} piece${list.length===1?'':'s'}${active?' · <button class="zlink" data-a="shopClear" data-k="all">Clear filters</button>':''}</p>`}
    <div id="zgrid">${list.length ? `<div class="zgrid ${fabric?'c4':'c3'}">${shown.map(p=>pcard(p,{square:fabric, fabricAction:p.type==='fabric'})).join('')}</div>` : `<div class="empty"><h3>Nothing matches</h3><p>Try another filter.</p><button class="btn" data-a="shopClear" data-k="all">Reset filters</button></div>`}</div>
    ${pages>1?`<nav class="pager" aria-label="Pages">${f.page>1?`<button data-a="shopPage" data-v="${f.page-1}" aria-label="Previous page">←</button>`:''}${Array.from({length:pages},(_,i)=>`<button data-a="shopPage" data-v="${i+1}" ${f.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}${f.page<pages?`<button data-a="shopPage" data-v="${f.page+1}" aria-label="Next page">→</button>`:''}</nav>`:''}
    ${fabric?'<p class="faint" style="font-size:12.5px;margin-top:18px">Prices are per item as listed by IZELIA. Ask about lengths and quantities before ordering several.</p>':''}
  </div>`;
}

function viewProduct(){
  S.vcfg = null;
  const p = Store.products[S.params.id];
  if (!p || (p.status!=='published' && !Store.canPublish())) return `<div class="empty"><h3>This piece is not available</h3><p>It may have sold out or been removed.</p><button class="btn" data-a="goShop" data-r="shop" data-c="all">Back to the shop</button></div>`;
  const v = S.pview && S.pview.id===p.id ? S.pview : (S.pview = {id:p.id, size:p.sizes.length===1?p.sizes[0]:null, qty:1, img:0, media:undefined, zoom:false});
  if (v.media===undefined){ v.media = null; Store.getMedia(p.id).then(m => { if (S.pview?.id===p.id){ v.media = m || {images:[]}; if (S.route==='product') App.softRender(); } }); }
  const imgs = (v.media?.images?.length ? v.media.images.map(i=>i.data) : (photoOf(p) ? [photoOf(p)] : []));
  const st = stockOf(p);
  const related = productsPub().filter(x=>x.id!==p.id && x.subtype===p.subtype).concat(productsPub().filter(x=>x.id!==p.id && x.type===p.type && x.subtype!==p.subtype)).slice(0,4);
  const c = Store.content, g = productAsGarment(p);
  const coll = p.collections.find(x=>x!=='royalty') || p.collections[0];
  const short = p.description || ({garment:'Made by IZELIA in Sierra Leone.', fabric:'Hand-dyed fabric from IZELIA’s Sierra Leone workshop.', accessory:'An IZELIA accessory.'})[p.type];
  return `
  <nav class="zcrumb" aria-label="Breadcrumb"><button data-a="go" data-r="home">Home</button><span>/</span><button data-a="goShop" data-r="shop" data-c="${coll}">${esc(COLL_META[coll]?.title || 'Shop')}</button><span>/</span><span>${esc(p.name)}</span></nav>
  <div class="zpd">
    <div class="zthumbs">${imgs.map((src,i)=>`<button data-a="pImg" data-i="${i}" aria-pressed="${v.img===i}" aria-label="Image ${i+1}"><img src="${src}" alt=""></button>`).join('')}</div>
    <div class="zmain ${v.zoom?'zoom':''}" ${imgs.length?'data-a="pZoom" role="button" tabindex="0" aria-label="Zoom image"':''}>${imgs.length ? `<img src="${imgs[Math.min(v.img, imgs.length-1)]}" alt="${esc(p.name)}" ${p.thumb||v.media?.images?.length?'':'onerror="izImgFail(this)" referrerpolicy="no-referrer"'}>` : `<div class="zimg ph" style="position:absolute;inset:0"><span>IZELIA</span><small>Photo coming soon</small></div>`}
      <button class="zheart" data-a="wish" data-id="${p.id}" aria-pressed="${isWished(p.id)}" aria-label="Wishlist">${ic('heart', isWished(p.id)?'fill="currentColor"':'')}</button></div>
    <div class="zinfo">
      <h1>${esc(p.name)}</h1>
      <span class="zprice">${priceFmt(p.price, p.currency)}${p.type==='fabric'?' <small>per item as listed</small>':''}</span>
      ${p.status!=='published'?'<span class="chip warn">Draft: only staff can see this</span>':''}
      <p class="zdesc">${esc(short)}</p>
      ${p.sizes.length ? `<div class="zopt"><span>Size${p.sizes.length>1?':':': '+esc(p.sizes[0])}</span>${p.sizes.length>1?`<div class="sizes">${p.sizes.map(s=>`<button data-a="pSize" data-v="${esc(s)}" aria-pressed="${v.size===s}">${esc(s)}</button>`).join('')}</div>`:''}</div>`:''}
      <div class="zopt"><span>Quantity:</span><div class="qtybox"><button data-a="pQty" data-d="-1" aria-label="Decrease quantity">−</button><input type="number" id="pq" min="1" max="20" value="${v.qty}" data-ch="pQtyIn" aria-label="Quantity"><button data-a="pQty" data-d="1" aria-label="Increase quantity">+</button></div></div>
      <button class="btn lime zadd" data-a="addBag" data-id="${p.id}" ${st.ok?'':'disabled'}>${st.ok?'Add to cart →':'Out of stock'}</button>
      <button class="zwish" data-a="wish" data-id="${p.id}">${ic('heart', isWished(p.id)?'fill="currentColor"':'')} ${isWished(p.id)?'Saved to wishlist':'Add to wishlist'}</button>
      <span class="faint" style="font-size:12.5px">${esc(st.label)}${p.stock?.tracked?'':' · stock not tracked online'}</span>
      <div class="acc">

        ${p.type!=='accessory'?`<details><summary>Size guide</summary><div class="body">${p.type==='garment' ? `Garment measurements for this piece haven’t been published yet. Contact IZELIA for exact measurements${g?', or try it on your saved avatar':', or design a made-to-measure version in the studio'}.` : 'Fabrics are sold per item as listed; ask IZELIA about the length of each piece.'}</div></details>`:''}
        <details><summary>Shipping & returns</summary><div class="body"><ul style="margin:0;padding-left:18px">${c.delivery.filter(d=>d.enabled).map(d=>`<li>${esc(d.label)}: ${d.price===0?'free':priceFmt(d.price)} · ${esc(d.eta)}</li>`).join('')}</ul><p style="margin-top:8px">Returns within 14 days in Sierra Leone or 30 days internationally, unworn with tags, refunded as a voucher. Sale items can’t be returned. <button class="zlink" data-a="goPolicy" data-p="returns">Full policy</button></p></div></details>

        ${p.type==='fabric' ? `<details open><summary>Design with this fabric</summary><div class="body stack s"><span>Use ${esc(p.name)} as the material for your own design in the AI Tailoring Studio.</span><div><button class="btn sm primary" data-a="designWithFabric" data-id="${p.id}">Design with this fabric</button></div></div></details>` : ''}
      </div>
    </div>
  </div>
  ${related.length ? `<section class="zsec"><h2 class="zlabel">You may also like</h2><div class="zgrid c4">${related.map(x=>pcard(x)).join('')}</div></section>`:''}`;
}

function viewAbout(){

  const c = Store.content, a = c.aboutImages || [];
  const img1 = a[0] || MOCK_IMG.story, img2 = a[1] || a[2] || MOCK_IMG.mission;
  return `<div class="wrap">
    <section class="zsec zpanel zabout">

      <div class="stack"><h1 class="zh">Our story</h1>

const CONF_LABEL = {good:['ok','Good'], check:['warn','Check'], rough:['bad','Rough']};

        <label class="btn primary" style="position:relative;overflow:hidden">${ic('upload')}Choose scan file<input type="file" accept=".glb,.gltf,.obj,.ply,.stl" data-ch="scanFile" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Choose a 3D scan file"></label>

      </div>
      <div class="stack s" style="font-size:13.5px">
        <b>For a good scan</b>
        <ul style="margin:0;padding-left:18px" class="muted">
          <li>Fitted clothes or underwear, hair tied back, no shoes.</li>
          <li>Stand still, feet hip-width apart, arms held a little away from your sides.</li>

      </div>
    </div>

  if (I.stage==='busy') body = `
    <h2>Measuring your scan</h2>

  if (I.stage==='error') body = `

    <div class="note warn">${esc(I.err)}</div>

    <div class="row">${S.scanBuf && I.needHeight ? '<button class="btn primary" data-a="scanRetry">Try again</button>':''}<label class="btn" style="position:relative;overflow:hidden">Choose another file<input type="file" accept=".glb,.gltf,.obj,.ply,.stl" data-ch="scanFile" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Choose a 3D scan file"></label><button class="btn ghost" data-a="closeModal">Close</button></div>`;
  if (I.stage==='result' && S.scan){
    const r = S.scan, d = S.bodyEdit, sel = I.sel || {};
    const keys = MDEF.map(m=>m.k).filter(k=>r.m[k]);
    body = `
    <h2>Measurements from your scan</h2>
    <p class="muted" style="font-size:14px">${esc(r.name)} · ${Units.show(r.H)} tall (${esc(r.unitGuess)}) · ${Math.round(r.tris/1000)}k triangles · measured in ${(r.ms/1000).toFixed(1)} s</p>
    ${r.notes.length ? `<div class="note warn">${r.notes.map(esc).join('<br>')}</div>`:''}
    <div class="scroll-x"><table class="data"><thead><tr><th style="width:36px"><span class="visually-hidden">Use</span></th><th>Measurement</th><th class="num">From scan</th><th>Confidence</th><th class="num">${d?'In profile now':'Current'}</th></tr></thead><tbody>

    <div class="row tight"><button class="btn sm" data-a="scanReview">Review measurements</button><button class="btn sm" data-a="scanTurn">Turn to face front</button><button class="btn sm" data-a="scanFlip">Flip upside down</button></div>
  </div>`;

function runScanImport(){
  const I = S.scanImp; const {name, buf} = S.scanBuf;
  I.stage = 'busy'; I.file = name; App.modal(scanImportModal());
  setTimeout(()=>{
    try {
      const r = processScan(name, buf, {height:I.height||null, flip:!!I.flip, turn:!!I.turn});
      S.scan = r; I.stage = 'result'; I.needHeight = false;
      const d = S.bodyEdit; I.sel = {};
      for (const [k,v] of Object.entries(r.m)) I.sel[k] = v.conf==='good' || (v.conf==='check' && d?.m?.[k]==null);
      if (I.height) I.sel.height = false; // height came from the person, not the scan
      if (!S.viewer.scanMode) S.viewer.scanMode = 'scan';
    } catch(e){ I.stage = 'error'; I.err = e.message || String(e); I.needHeight = !!e.needHeight || /size|tall|height/i.test(I.err); }
    if (S.route==='body'){ App.render(); }
    App.modal(scanImportModal());
  }, 40);
}

Object.assign(ACT, {
  openScanImport(){ S.scanImp = {stage: S.scan ? 'result' : 'pick', sel:S.scanImp?.sel, height:S.scanImp?.height, flip:S.scanImp?.flip, turn:S.scanImp?.turn}; App.modal(scanImportModal()); },
  scanReview(){ ACT.openScanImport(); },
  scanRetry(el){
    const id = el?.dataset?.src || (document.getElementById('si-h2') ? 'si-h2' : 'si-h');
    const v = Units.toCm(document.getElementById(id)?.value);
    if (!v || v<90 || v>240){ toast('Enter the person’s real height, between 90 and 240 cm.', true); return; }
    S.scanImp.height = v; if (!S.scanBuf){ S.scanImp.stage = 'pick'; App.modal(scanImportModal()); return; }
    runScanImport();
  },
  scanApply(){
    const r = S.scan, I = S.scanImp; if (!r) return;
    if (!S.bodyEdit){ ACT.newProfile(); }
    const d = S.bodyEdit, used = [];
    for (const [k, on] of Object.entries(I.sel||{})) if (on && r.m[k] && validMeasure(k, r.m[k].v)){ d.m[k] = r.m[k].v; used.push(k); }
    if (I.height && !d.m.height){ d.m.height = Math.round(I.height*2)/2; used.push('height'); }
    if (!used.length){ toast('Select at least one measurement to use.', true); return; }
    d.method = 'scan'; d.verified = false;
    d.scanInfo = {file:r.name, at:nowIso(), keys:used};
    S.viewer.scanMode = 'compare';
    App.closeModal(); S.route = 'body'; App.render();
    toast(`${used.length} measurement${used.length>1?'s':''} filled from the scan. Check them, then save the profile.`);
  },
  scanView(){ App.closeModal(); S.viewer.scanMode = 'scan'; if (S.route!=='body') App.go('body'); else App.render(); },
  scanMode(el){ S.viewer.scanMode = el.dataset.v; App.render(); },
  scanTurn(){ S.scanImp.turn = !S.scanImp.turn; runScanImport(); },
  scanFlip(){ S.scanImp.flip = !S.scanImp.flip; runScanImport(); },
  scanRemove(){ S.scan = null; S.scanBuf = null; S.scanImp = null; App.render(); toast('Scan removed from this device.'); },
});
Object.assign(CH, {
  async scanFile(el){
    const f = el.files[0]; if (!f) return;
    const consent = document.getElementById('si-consent');
    if (consent && !consent.checked){ toast('Tick the consent box first.', true); el.value = ''; return; }
    S.settings.consentScan = true;
    const ext = (f.name.split('.').pop()||'').toLowerCase();
    if (!SCAN_EXT.includes(ext)){ toast('Use a .glb, .gltf, .obj, .ply or .stl file.', true); return; }
    if (f.size > 200e6){ toast('That file is larger than 200 MB. Export a lighter version of the scan.', true); return; }
    const hIn = document.getElementById('si-h') || document.getElementById('si-h2');
    const h = hIn ? Units.toCm(hIn.value) : null;
    S.scanImp = Object.assign(S.scanImp || {}, {height: h && h>=90 && h<=240 ? h : (S.scanImp?.height||null), flip:false, turn:false});
    S.scanBuf = {name:f.name, buf:await f.arrayBuffer()};
    runScanImport();
  },
  scanSel(el){ S.scanImp.sel[el.dataset.k] = el.checked; const b = document.querySelector('[data-a="scanApply"]'); if (b) b.textContent = `Use ${Object.values(S.scanImp.sel).filter(Boolean).length} selected in ${S.bodyEdit?S.bodyEdit.name:'a new profile'}`; },
});

boot();
